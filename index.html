function planA(t){
  let acc=0;
  for(let i=0;i<E.projet.clips.length;i++){
    const c=E.projet.clips[i], d=c.fin-c.debut;
    if(t<acc+d) return {i, c, dans:(t-acc)/d};
    acc+=d;
  }
  const i=E.projet.clips.length-1;
  return E.projet.clips.length?{i,c:E.projet.clips[i],dans:1}:null;
}
function stA(t){ return E.projet.sousTitres.find(s=>t>=s.debut&&t<s.fin)||null; }

function zoomDe(p, avecZoom){
  if(!p || avecZoom===false || p.c.zoomAmplitude<=0) return 1;
  const a=p.c.zoomAmplitude/100;
  return p.c.zoomSens==="avant" ? 1+a*p.dans : (1+a)-a*p.dans;
}

/* Taille du cadre en plein écran : celle des deux dimensions du téléphone qui
   laisse le 9:16 entier visible, jamais débordant. */
function tailleFullscreen(){
  const boite=document.getElementById("tel");
  if(!boite) return 300;
  const r=boite.getBoundingClientRect();
  if(!r.width || !r.height) return 300;
  return Math.max(120, Math.min(r.height, r.width*16/9));
}

/* Le balayage repeint ces nœuds au lieu de reconstruire le HTML : c'est ce qui
   fait la différence entre un aperçu qui suit le doigt et un aperçu qui saccade. */
function apercu(t, opt){
  opt=opt||{};
  const p = planA(t);
  const sObj = stA(t);
  const s = opt.st!==undefined ? opt.st : (sObj?sObj.texte:null);
  const st = E.projet.style;
  const plein = !!(opt.fullscreen && E.pleinEcran);
  const hauteur = plein ? tailleFullscreen() : (opt.h||300);
  /* taillePct est un pourcentage de la LARGEUR DE L'IMAGE. En CSS, une
     font-size en pourcentage se calcule sur la police héritée, pas sur la
     largeur : « 5% » donnait 5 % de 17 px, soit moins d'un pixel — les
     sous-titres étaient bien rendus, mais invisibles. On convertit donc en
     pixels à partir de la largeur réelle du cadre 9:16. */
  const largeurCadre = hauteur*9/16;
  const stPx = (E.projet.style.taillePct/100)*largeurCadre;
  const za = E.zoomAp || {scale:1};

  const bouton = opt.fullscreen
    ? `<button id="boutonPlein" class="btnPlein" data-act="pleinEcran"
        aria-label="${plein?"Quitter le plein écran":"Plein écran"}"
        title="${plein?"Quitter le plein écran":"Plein écran"}">${plein?"✕":"⛶"}</button>`
    : "";
  const transportPlein = plein ? `
    <div class="transportPlein">
      <button data-act="debut" aria-label="Revenir au début" title="Revenir au début">${icone("debut")}</button>
      <button class="jouer" data-act="lire" aria-label="${enLecture()?"Pause":"Lire"}"
        title="${enLecture()?"Pause":"Lire"}">${icone(enLecture()?"pause":"jouer")}</button>
      <button data-act="fin" aria-label="Aller à la fin" title="Aller à la fin">${icone("fin")}</button>
    </div>
    <div class="tps num transportPlein" id="tLectPlein">${tpsD(tL())} / ${tpsD(dureeTotale())}</div>` : "";

  return `<div class="cadre${plein?" pleinEcranActif":""}" style="height:${hauteur}px">
    <div class="neuf16" id="apCadre" style="height:100%">
      <div class="apZoom" id="apZoom" style="transform:scale(${za.scale})">
        <div class="media" id="apMedia" style="transform:scale(${zoomDe(p,opt.zoom).toFixed(4)})"></div>
        <div class="plan" id="apPlan" style="transform:scale(${zoomDe(p,opt.zoom).toFixed(4)});transform-origin:50% 45%">${p?("Plan "+(p.i+1)):"—"}</div>
        <div class="st ${st.police}" id="apSt" style="left:${st.x}%;top:${st.y}%;color:${st.couleur};font-size:${stPx.toFixed(2)}px;${s?"":"display:none"}">${esc(s||"")}</div>
      </div>
      <div class="horloge num" id="apHorloge" style="${opt.horloge?"":"display:none"}">${tpsD(t)}</div>
      ${opt.badge?`<div class="badge">${esc(opt.badge)}</div>`:""}
      ${bouton}${transportPlein}
    </div></div>`;
}
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* Icônes de transport en SVG plutôt qu'en emoji : sur iPhone, les glyphes
   ⏮⏸▶⏭ s'affichent en couleur quelle que soit la couleur de texte demandée,
   ce qui jure avec une interface plate et sobre. Le SVG hérite de la couleur
   du bouton via currentColor, en accord avec la direction visuelle. */
function icone(nom){
  const a='width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"';
  if(nom==="debut") return `<svg ${a}><rect x="3" y="3" width="2.4" height="14"/><path d="M17 3.3 L7.2 10 L17 16.7 Z"/></svg>`;
  if(nom==="fin")   return `<svg ${a}><rect x="14.6" y="3" width="2.4" height="14"/><path d="M3 3.3 L12.8 10 L3 16.7 Z"/></svg>`;
  if(nom==="jouer") return `<svg ${a}><path d="M5 3 L16.5 10 L5 17 Z"/></svg>`;
  if(nom==="pause") return `<svg ${a}><rect x="5" y="3" width="3.6" height="14" rx="1"/><rect x="11.4" y="3" width="3.6" height="14" rx="1"/></svg>`;
  if(nom==="chevronG") return `<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 L6 10 L12 16"/></svg>`;
  if(nom==="chevronD") return `<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4 L14 10 L8 16"/></svg>`;
  return "";
}

/* Monte la vraie vidéo du plan courant si elle a été importée ; sinon le
   rectangle numéroté de la maquette. */
/* iOS n'autorise le démarrage d'une vidéo que pendant un geste utilisateur.
   Une vidéo montée plus tard, au changement de plan, refuse donc de jouer :
   écran noir jusqu'à ce qu'on touche l'écran. On les « débloque » toutes au
   moment où l'utilisateur appuie sur Lire, en les démarrant puis les
   arrêtant aussitôt, sans un son. */
function amorcerVideos(){
  for(const id in MEDIA.videos){
    const v=MEDIA.videos[id];
    if(v.__amorcee) continue;
    const muetAvant=v.muted;
    v.muted=true;
    try{
      const p=v.play();
      if(p && p.then) p.then(()=>{ try{v.pause();}catch(e){} v.muted=muetAvant; v.__amorcee=true; }).catch(()=>{});
      else { try{v.pause();}catch(e){} v.muted=muetAvant; v.__amorcee=true; }
    }catch(e){}
  }
}

/* Prépare le plan suivant pendant que le courant joue : sans cela, le
   changement de plan tombe sur une vidéo qui n'a encore aucune image
   décodée, d'où le noir. */
function preparerSuivant(t){
  const p=planA(t); if(!p) return;
  const suivant=E.projet.clips[p.i+1]; if(!suivant) return;
  const v=MEDIA.videos[suivant.id]; if(!v) return;
  if(v.readyState<2){ try{ v.load(); }catch(e){} return; }
  if(Math.abs(v.currentTime-suivant.debut)>0.5){ try{ v.currentTime=suivant.debut; }catch(e){} }
}

function monterMedia(t, avecZoom){
  const cadre=document.getElementById("apMedia"); if(!cadre) return null;
  const p=planA(t);
  const v=(p && MEDIA.videos[p.c.id]) || null;
  const img=(p && !v && MEDIA.images[p.c.id]) || null;
  const el = v || img;
  const actuel=cadre.firstElementChild;
  if(el!==actuel){ if(actuel) actuel.remove(); if(el) cadre.appendChild(el); }
  if(v && p){
    const local = p.c.debut + p.dans*(p.c.fin-p.c.debut);
    /* Pendant la lecture, la vidéo avance d'elle-même : la recaler à chaque
       image relance un décodage complet et fige les fichiers un peu lourds.
       On ne corrige que les dérives franches, et jamais plus de deux fois
       par seconde. */
    const maintenant = (typeof performance!=="undefined"?performance.now():Date.now());
    if(!enLecture()){
      try{ if(Math.abs(v.currentTime-local)>0.05) v.currentTime=local; }catch(e){}
    } else if(Math.abs(v.currentTime-local)>0.6 && maintenant-(v.__dernierRecalage||0)>500){
      v.__dernierRecalage=maintenant;
      try{ v.currentTime=local; }catch(e){}
    }
    if(enLecture() && v.paused) { const j=v.play(); if(j&&j.catch) j.catch(()=>{}); }
    if(!enLecture() && !v.paused) v.pause();
    if(enLecture()) preparerSuivant(t);
  }
  for(const id in MEDIA.videos){ const o=MEDIA.videos[id]; if(o!==v && !o.paused) o.pause(); }
  cadre.style.transform="scale("+zoomDe(p,avecZoom).toFixed(4)+")";
  return el;
}

function peindreApercu(t, stForce, avecZoom){
  const p = planA(t);
  const v = monterMedia(t, avecZoom);
  const plan = document.getElementById("apPlan");
  if(plan){
    const txt = p?("Plan "+(p.i+1)):"—";
    if(plan.textContent!==txt) plan.textContent=txt;
    plan.style.transform = "scale("+zoomDe(p,avecZoom).toFixed(4)+")";
    plan.style.display = v ? "none" : "";
  }
  const el = document.getElementById("apSt");
  if(el){
    const sObj = stA(t);
    const s = stForce!==undefined ? stForce : (sObj?sObj.texte:null);
    if(s){ if(el.textContent!==s) el.textContent=s; el.style.display=""; }
    else el.style.display="none";
  }
  const h = document.getElementById("apHorloge");
  if(h){ h.textContent=tpsD(t); h.style.display=""; }
}

/* ---------- 5. Bande de montage (4.8) ------------------------------------ */

const tetePos = () => E.tete!==null ? E.tete : (E.lecture ? E.lecture.t : null);

function bande(){
  const P=E.projet, ech=echelle(), dur=dureeTotale();
  const W=Math.max(dur*ech, (E.largeurBande||330)-4);
  const pasG = graduationNette(ech);

  let regle="";
  for(let t=0;t<=dur;t+=pasG){
    regle += `<i style="left:${t*ech}px"></i><span style="left:${t*ech+3}px">${tps(t)}</span>`;
  }
  let clips="";
  P.clips.forEach((c,i)=>{
    const d=c.fin-c.debut, x=debutDe(i)*ech, w=Math.max(d*ech,26);
    const z = c.zoomAmplitude>0 ? `<div class="d">zoom ${c.zoomSens==="avant"?"↗":"↘"}</div>` : "";
    const court = w<64;
    const sel = E.blocSelectionne && E.blocSelectionne.type==="clip" && E.blocSelectionne.id===c.id;
    const poignees = sel ? `
      <div class="poignee g" data-poignee="debut" data-cible="clip" data-id="${c.id}" aria-label="Raccourcir ou allonger le début">${icone("chevronG")}</div>
      <div class="poignee d" data-poignee="fin" data-cible="clip" data-id="${c.id}" aria-label="Raccourcir ou allonger la fin">${icone("chevronD")}</div>` : "";
    clips += `<div class="bloc clip${sel?" selectionne":""}" data-type="clip" data-id="${c.id}" style="left:${x}px;width:${w-3}px"
      aria-label="Clip ${i+1}, ${d.toFixed(1)} secondes${sel?", sélectionné":""}">
      <div>${i+1}</div>${court?"":`<div class="d num">${d.toFixed(1)} s</div>${z}`}${poignees}</div>`;
  });
  let audios="";
  P.audios.forEach(a=>{
    const w=Math.max(a.duree*ech,40);
    const sel = E.blocSelectionne && E.blocSelectionne.type==="audio" && E.blocSelectionne.id===a.id;
    const ph = sel ? `
      <div class="poignee g" data-poignee="debut" data-cible="audio" data-id="${a.id}" aria-label="Raccourcir ou allonger le début">${icone("chevronG")}</div>
      <div class="poignee d" data-poignee="fin" data-cible="audio" data-id="${a.id}" aria-label="Raccourcir ou allonger la fin">${icone("chevronD")}</div>` : "";
    audios += `<div class="rang"><div class="bloc audio${sel?" selectionne":""}" data-type="audio" data-id="${a.id}"
      style="left:${a.decalage*ech}px;width:${w-3}px" aria-label="Bande son ${esc(a.nom)}${sel?", sélectionnée":""}">
      <div>${esc(a.nom)}</div>${w<80?"":`<div class="d num">${a.duree.toFixed(1)} s</div>`}${ph}</div></div>`;
  });
  let sst="";
  P.sousTitres.forEach(s=>{
    const para = P.paragraphes.find(p=>p.id===s.paragrapheId);
    const v = para && !para.cale ? " verif" : "";
    const w = Math.max((s.fin-s.debut)*ech,14);
    const sel = E.blocSelectionne && E.blocSelectionne.type==="st" && E.blocSelectionne.id===s.id;
    sst += `<div class="bloc sst${v}${sel?" selectionne":""}" data-type="st" data-id="${s.id}"
      style="left:${s.debut*ech}px;width:${w-3}px" aria-label="Sous-titre ${esc(s.texte.slice(0,30))}"
      >${w>34?esc(s.texte.slice(0,22)):""}</div>`;
  });

  const tt = tetePos();
  const enT = E.tete!==null ? `Lâchez à ${tpsD(E.tete)}` : (E.lecture ? tpsD(E.lecture.t) : tps(dur));
  const pas = pasContinu(ech);
  const pasTxt = pas<1 ? Math.round(pas*1000)+" ms" : "0,5 s";
  const min = echelleMinimale();
  const vueEnsemble = ech<=min+0.05;

  // Un bouton n'a l'air « actif » que si le pincement n'a pas déjà éloigné
  // l'échelle de ce préréglage : au-delà d'un petit écart, aucun des trois
  // n'est plus vraiment vrai, et forcer un affichage serait mentir.
  const pres = n => {
    const cible = min * POURCENTAGES[n];
    return Math.abs(ech-cible)/cible < 0.04;
  };

  return `
  <div class="bandeCadre">
    <div class="bandeEnt"><span class="t">Bande de montage</span><span class="v num" id="bandeT">${enT}</span></div>
    <div class="defil" id="defil"><div class="piste" style="width:${W}px" id="piste">
      <div class="regle">${regle}</div>
      <div class="rang">${clips}</div>
      ${audios}
      <div class="rang st">${sst}</div>
      <div class="tete" id="tete" style="left:0;transform:translateX(${(tt||0)*ech}px);${tt===null?"display:none":""}"></div>
    </div></div>
    <div class="prec">
      ${[100,50,25].map(n=>`<button data-prec="${n}" aria-pressed="${pres(n)}">${n} %</button>`).join("")}
    </div>
    <div class="pas num">Calage au ${pasTxt} près${vueEnsemble?" · tout le montage à l'écran":""}</div>
  </div>`;
}

function majTete(t){
  const tete=document.getElementById("tete");
  if(tete){ tete.style.display=""; tete.style.transform="translateX("+(t*echelle())+"px)"; }
  const ent=document.getElementById("bandeT");
  if(ent) ent.textContent=(E.tete!==null?"Lâchez à ":"")+tpsD(t);
}

/* Repeint la bande à l'échelle courante SANS reconstruire son HTML : c'est ce
   qui rend le pincement fluide plutôt que saccadé. Un rendu complet (rendre())
   détruit et recrée toute la piste à chaque frame — imperceptible pour un clic,
   mais un pincement en déclenche des dizaines par seconde. Ici, on ne touche
   qu'à ce qui a changé : la largeur des blocs et leur position. */
function redessinerBandeContinu(){
  const piste=document.getElementById("piste"); if(!piste) return;
  const P=E.projet, ech=echelle(), dur=dureeTotale();
  piste.style.width = Math.max(dur*ech, (E.largeurBande||330)-4)+"px";

  P.clips.forEach((c,i)=>{
    const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]'); if(!el) return;
    el.style.left=(debutDe(i)*ech)+"px";
    el.style.width=(Math.max((c.fin-c.debut)*ech,26)-3)+"px";
  });
  P.audios.forEach(a=>{
    const el=piste.querySelector('.bloc.audio[data-id="'+a.id+'"]'); if(!el) return;
    el.style.left=(a.decalage*ech)+"px";
    el.style.width=(Math.max(a.duree*ech,40)-3)+"px";
  });
  P.sousTitres.forEach(s=>{
    const el=piste.querySelector('.bloc.sst[data-id="'+s.id+'"]'); if(!el) return;
    el.style.left=(s.debut*ech)+"px";
    el.style.width=(Math.max((s.fin-s.debut)*ech,14)-3)+"px";
  });

  const regle=piste.querySelector(".regle");
  if(regle){
    const pasG=graduationNette(ech); let html="";
    for(let t=0;t<=dur;t+=pasG) html += `<i style="left:${t*ech}px"></i><span style="left:${t*ech+3}px">${tps(t)}</span>`;
    regle.innerHTML=html;
  }

  majTete(tetePos()||0);

  const pas=pasContinu(ech);
  const pasTxt = pas<1 ? Math.round(pas*1000)+" ms" : "0,5 s";
  const min=echelleMinimale();
  const pasEl=document.querySelector(".pas");
  if(pasEl) pasEl.textContent = "Calage au "+pasTxt+" près"+(ech<=min+0.05?" · tout le montage à l'écran":"");

  document.querySelectorAll("[data-prec]").forEach(btn=>{
    const cible = min * POURCENTAGES[btn.dataset.prec];
    btn.setAttribute("aria-pressed", Math.abs(ech-cible)/cible<0.04 ? "true":"false");
  });
}

const SEUIL_GLISSE = 5;   // px : en deçà, c'est un appui
const MARGE_AUTO   = 42;  // px : zone de défilement automatique au bord

/* Un seul doigt fait glisser un bloc ; deux doigts pincent la bande. Les deux
   gestes utilisent les mêmes événements de pointeur, donc sans coordination
   explicite le second doigt posé sur un bloc démarre AUSSI un glissement — et
   c'est exactement ce qui décalait les vidéos et les pistes pendant un pincement.
   Geste.actifs suit chaque doigt ; dès qu'un deuxième arrive, le glissement en
   cours est annulé et rien ne peut en redémarrer un tant que les deux doigts
   ne sont pas complètement relevés. */
const Geste = { actifs:new Map(), pince:false, dist0:0, glissementCourant:null, raf:null };

function annulerGlissementEnCours(){
  if(Geste.glissementCourant){ Geste.glissementCourant(); Geste.glissementCourant=null; }
}

/* Un seul repeint par image, quel que soit le nombre d'événements de
   pincement reçus entre deux frames : c'est ce qui garde le geste fluide
   même sur un projet chargé. */
function planifierRedessinContinu(){
  if(Geste.raf==null) Geste.raf=requestAnimationFrame(()=>{ Geste.raf=null; redessinerBandeContinu(); });
}

function brancherGlisse(){
  const piste=document.getElementById("piste"); if(!piste) return;
  const defil=document.getElementById("defil");
  E.largeurBande = defil.clientWidth || E.largeurBande || 330;
  Geste.glissementCourant=null; // un ancien glissement ne doit pas survivre à un nouveau rendu
  // Geste.actifs / Geste.pince : volontairement pas réinitialisés ici. Un
  // changement de niveau de précision redessine la bande EN PLEIN PINCEMENT ;
  // les deux doigts doivent rester suivis pendant toute la durée du geste.

  const distance = ()=>{
    const pts=[...Geste.actifs.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  };

  /* Capturée sur la bande entière, donc vue avant le gestionnaire posé sur
     chaque bloc : c'est ce qui permet d'intercepter le deuxième doigt avant
     qu'il ne déclenche son propre glissement. */
  defil.addEventListener("pointerdown",e=>{
    Geste.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Geste.actifs.size===2){
      Geste.pince=true;
      annulerGlissementEnCours();
      Geste.dist0=distance();
    }
  },{capture:true});

  defil.addEventListener("pointermove",e=>{
    if(!Geste.actifs.has(e.pointerId)) return;
    Geste.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Geste.pince && Geste.actifs.size>=2){
      const d=distance();
      if(Geste.dist0>0){
        E.echellePxS = clampEchelle(echelle() * (d/Geste.dist0));
        planifierRedessinContinu();
      }
      Geste.dist0=d;
      e.stopPropagation();
    }
  },{capture:true});

  const relacherPointeur=e=>{
    Geste.actifs.delete(e.pointerId);
    if(Geste.actifs.size===0) Geste.pince=false;
  };
  defil.addEventListener("pointerup",relacherPointeur,{capture:true});
  defil.addEventListener("pointercancel",relacherPointeur,{capture:true});

  piste.querySelectorAll(".bloc").forEach(b=>{
    const type=b.dataset.type, id=b.dataset.id;
    b.setAttribute("role","button"); b.setAttribute("tabindex","0");
    b.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); b.click(); } });

    const selectionne = E.blocSelectionne && E.blocSelectionne.type===type && E.blocSelectionne.id===id;

    if(!selectionne){
      /* Pas encore sélectionné : le toucher ne doit RIEN intercepter — c'est
         ce qui permet de faire défiler la page en balayant par-dessus une
         vidéo ou un son sans le décaler par erreur. Un simple appui (le seul
         geste qui produit un « click » natif sans avoir bougé) le sélectionne ;
         touch-action:pan-x pan-y laisse le reste au défilement natif. */
      b.addEventListener("click",()=>{
        if(Geste.pince) return;
        E.blocSelectionne={type,id};
        rendre();
      });
      return;
    }

    /* Sélectionné : redevient une cible de glissement exclusive, exactement
       comme avant. Un appui SANS glissement sur un bloc déjà sélectionné
       ouvre son écran de détail (clip, sous-titre) ou referme la sélection
       (bande son, qui n'a pas d'écran dédié depuis la bande). */
    let vuPointeur=false;
    b.addEventListener("click",()=>{
      if(vuPointeur) return;
      if(type==="clip") aller("clip",{clipId:id});
      else if(type==="st") aller("editST",{stId:id});
      else { E.blocSelectionne=null; rendre(); }
    });

    b.addEventListener("pointerdown",dep=>{
      if(Geste.pince || Geste.actifs.size>=2) return; // un pincement est en cours : pas de glissement
      if(dep.target.closest(".poignee")) return; // laissé au gestionnaire des poignées
      dep.preventDefault();
      vuPointeur=true; setTimeout(()=>{vuPointeur=false;},350);

      const ech = echelle();
      const gauche0 = parseFloat(b.style.left)||0;
      const x0 = dep.clientX, scroll0 = defil.scrollLeft;
      let bouge=false, raf=null, xCourant=x0, annule=false;

      const obj = type==="audio" ? E.projet.audios.find(a=>a.id===id)
                : type==="st"    ? E.projet.sousTitres.find(s=>s.id===id) : null;
      if(type!=="clip" && !obj) return;
      const base = type==="audio" ? obj.decalage : type==="st" ? obj.debut : 0;

      let ordre = type==="clip" ? E.projet.clips.slice() : null;
      let iCourant = ordre ? ordre.findIndex(c=>c.id===id) : -1;
      const larg = c => Math.max((c.fin-c.debut)*ech, 26);
      const gaucheDe = (tab,k) => tab.slice(0,k).reduce((s,c)=>s+larg(c),0);

      try{ b.setPointerCapture(dep.pointerId); }catch(e){}

      /* Si un deuxième doigt se pose pendant ce glissement, Geste appelle ceci
         immédiatement : on efface tout effet visuel déjà produit (position du
         bloc, réordonnancement éventuel des clips voisins) et on rend la main
         au pincement. Le drapeau « annule » ferme la porte même si un
         événement de pointeur en cours de route arrivait malgré tout. */
      Geste.glissementCourant = ()=>{
        annule=true;
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        b.removeEventListener("pointermove",bouger);
        b.removeEventListener("pointerup",finir);
        b.removeEventListener("pointercancel",finir);
        try{ b.releasePointerCapture(dep.pointerId); }catch(e){}
        b.classList.remove("saisi"); b.style.transform="";
        if(type==="clip"){
          E.projet.clips.forEach((c,k)=>{
            const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]');
            if(el) el.style.left=gaucheDe(E.projet.clips,k)+"px";
          });
        }
        E.tete=null;
        const teteEl=document.getElementById("tete"); if(teteEl) teteEl.style.display="none";
        peindreApercu(tL());
      };

      const planifier = ()=>{ if(raf==null) raf=requestAnimationFrame(peindre); };

      /* Séparé de l'affichage : un geste rapide relâché avant la première frame
         doit tout de même aboutir au bon ordre. */
      function recalculerOrdre(){
        if(!ordre) return false;
        const r=piste.getBoundingClientRect();
        const px = xCourant - r.left + defil.scrollLeft;
        let acc=0, cible=ordre.length-1;
        for(let k=0;k<ordre.length;k++){
          const w=larg(ordre[k]);
          if(px < acc + w/2){ cible=k; break; }
          acc+=w;
        }
        if(cible===iCourant) return false;
        const [pris]=ordre.splice(iCourant,1);
        ordre.splice(cible,0,pris); iCourant=cible;
        return true;
      }

      function peindre(){
        raf=null;
        if(!bouge) return;
        const dx = xCourant - x0 + (defil.scrollLeft - scroll0);

        if(type==="clip"){
          if(recalculerOrdre()){
            ordre.forEach((c,k)=>{
              if(c.id===id) return;
              const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]');
              if(el) el.style.left=gaucheDe(ordre,k)+"px";
            });
          }
          b.style.transform="translateX("+dx+"px)";
          E.tete=Math.max(0,(gauche0+dx)/ech);
        } else {
          const t=Math.max(0, base + dx/ech);
          b.style.transform="translateX("+((t-base)*ech)+"px)";
          E.tete=t;
        }
        majTete(E.tete);
        peindreApercu(E.tete, type==="st"?obj.texte:undefined);

        /* Défilement automatique quand le doigt approche du bord. */
        const rd=defil.getBoundingClientRect();
        let v=0;
        if(xCourant < rd.left+MARGE_AUTO) v=-9;
        else if(xCourant > rd.right-MARGE_AUTO) v=9;
        if(v){ defil.scrollLeft += v; planifier(); }
      }

      // Le seuil est franchi dans le gestionnaire lui-même : un geste rapide ne
      // doit pas être pris pour un appui parce que la frame n'est pas encore passée.
      const bouger = e2=>{
        if(annule) return;
        xCourant=e2.clientX;
        if(!bouge && Math.abs(xCourant-x0+(defil.scrollLeft-scroll0))>=SEUIL_GLISSE){
          bouge=true; b.classList.add("saisi");
        }
        planifier();
      };

      const finir = e2=>{
        if(annule) return;
        Geste.glissementCourant=null; // geste terminé normalement, plus rien à annuler
        b.removeEventListener("pointermove",bouger);
        b.removeEventListener("pointerup",finir);
        b.removeEventListener("pointercancel",finir);
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        if(typeof e2?.clientX==="number") xCourant=e2.clientX;
        const dx = xCourant - x0 + (defil.scrollLeft - scroll0);
        b.classList.remove("saisi"); b.style.transform=""; E.tete=null;

        if(!bouge){
          if(type==="clip") aller("clip",{clipId:id});
          else if(type==="st") aller("editST",{stId:id});
          else rendre();
          return;
        }
        if(type==="clip"){
          recalculerOrdre();
          if(ordre.map(c=>c.id).join(",")===E.projet.clips.map(c=>c.id).join(",")){ rendre(); return; }
          agir("Déplacement du clip", ()=>{ E.projet.clips = ordre; });
          return;
        }
        const pas=pasContinu(ech); // le pas de calage suit l'échelle continue, pas un palier nommé
        const t=Math.max(0, Math.round((base+dx/ech)/pas)*pas);
        const decal=t-base;
        if(Math.abs(decal)<1e-9){ rendre(); return; }
        agir(type==="audio"?"Déplacement de la bande son":"Recalage du sous-titre", ()=>{
          if(type==="audio"){
            obj.decalage=t;
            if(id===E.projet.voixOffId && E.projet.paragraphes.length){
              E.projet.paragraphes.forEach(p=>{p.debut+=decal;p.fin+=decal;});
              E.projet.sousTitres.forEach(s=>{ if(s.paragrapheId){s.debut+=decal;s.fin+=decal;} });
              E.toastEnAttente="Les sous-titres ont suivi la voix.";
            }
          } else { const d=obj.fin-obj.debut; obj.debut=t; obj.fin=t+d; }
        });
      };

      b.addEventListener("pointermove",bouger);
      b.addEventListener("pointerup",finir);
      b.addEventListener("pointercancel",finir);
    });
  });

  /* Poignées de raccourcissement / allongement, façon montage natif de
     l'iPhone. Sur un clip : le bord gauche reste ancré aux clips précédents
     (c'est ce qui les garde bout à bout), seule la largeur bouge. Sur une
     bande son : elle flotte librement dans le temps, donc raccourcir le début
     avance aussi son point d'entrée dans le fichier, en gardant sa fin fixe.
     Note : le §4.4 interdisait toute découpe audio ; changement demandé. */
  const DUREE_MIN_CLIP = 0.3;
  piste.querySelectorAll(".poignee").forEach(h=>{
    h.addEventListener("pointerdown",dep=>{
      if(Geste.pince || Geste.actifs.size>=2) return;
      dep.preventDefault(); dep.stopPropagation();
      const cote=h.dataset.poignee, cible=h.dataset.cible||"clip", id=h.dataset.id;
      const estAudio = cible==="audio";
      const o = estAudio ? E.projet.audios.find(x=>x.id===id) : E.projet.clips.find(x=>x.id===id);
      if(!o) return;
      const ech=echelle();
      const bloc=piste.querySelector('.bloc.'+(estAudio?"audio":"clip")+'[data-id="'+id+'"]');
      const dEl = bloc ? bloc.querySelector(".d") : null;

      // Instantané de l'état de départ : tout est calculé par rapport à lui.
      const S = estAudio
        ? {debut:o.debut||0, duree:o.duree, decalage:o.decalage, source:o.dureeSource ?? o.duree}
        : {debut:o.debut, fin:o.fin, finMax:o.finMax ?? o.fin};
      const x0=dep.clientX;
      let raf=null, dx=0, annule=false;

      try{ h.setPointerCapture(dep.pointerId); }catch(e){}

      Geste.glissementCourant = ()=>{
        annule=true;
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        h.removeEventListener("pointermove",bouger);
        h.removeEventListener("pointerup",finir);
        h.removeEventListener("pointercancel",finir);
        try{ h.releasePointerCapture(dep.pointerId); }catch(e){}
        redessinerBandeContinu();
      };

      function calculer(){
        const dt=dx/ech;
        if(estAudio){
          if(cote==="debut"){
            // On ne peut pas entrer avant le début du fichier, ni réduire
            // sous la durée minimale : la fin reste fixe dans le temps.
            const min=-S.debut, max=S.duree-DUREE_MIN_CLIP;
            const d=Math.max(min, Math.min(max, dt));
            return {debut:S.debut+d, duree:S.duree-d, decalage:S.decalage+d};
          }
          const max=S.source-S.debut, d=Math.max(DUREE_MIN_CLIP, Math.min(max, S.duree+dt));
          return {debut:S.debut, duree:d, decalage:S.decalage};
        }
        let debut=S.debut, fin=S.fin;
        if(cote==="debut") debut=Math.max(0, Math.min(S.fin-DUREE_MIN_CLIP, S.debut+dt));
        else fin=Math.max(S.debut+DUREE_MIN_CLIP, Math.min(S.finMax, S.fin+dt));
        return {debut,fin};
      }
      function peindre(){
        raf=null;
        const r=calculer();
        const duree = estAudio ? r.duree : (r.fin-r.debut);
        if(bloc){
          bloc.style.width=(Math.max(duree*ech, estAudio?40:26)-3)+"px";
          if(estAudio) bloc.style.left=(r.decalage*ech)+"px";
        }
        if(dEl) dEl.textContent=duree.toFixed(1)+" s";
      }
      function planifier(){ if(raf==null) raf=requestAnimationFrame(peindre); }
      const bouger=e2=>{ if(annule) return; dx=e2.clientX-x0; planifier(); };
      const finir=e2=>{
        if(annule) return;
        Geste.glissementCourant=null;
        h.removeEventListener("pointermove",bouger);
        h.removeEventListener("pointerup",finir);
        h.removeEventListener("pointercancel",finir);
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        if(typeof e2?.clientX==="number") dx=e2.clientX-x0;
        const r=calculer();
        const inchange = estAudio
          ? (Math.abs(r.duree-S.duree)<1e-6 && Math.abs(r.debut-S.debut)<1e-6)
          : (Math.abs(r.debut-S.debut)<1e-6 && Math.abs(r.fin-S.fin)<1e-6);
        if(inchange){ rendre(); return; }
        agir(cote==="debut"?"Ajustement du début":"Ajustement de la fin", ()=>{
          if(estAudio){ o.debut=r.debut; o.duree=r.duree; o.decalage=r.decalage; }
          else { o.debut=r.debut; o.fin=r.fin; }
        });
      };
      h.addEventListener("pointermove",bouger);
      h.addEventListener("pointerup",finir);
      h.addEventListener("pointercancel",finir);
    });
  });

  /* Toucher une zone vide de la bande (pas un bloc, pas une poignée) referme
     la sélection en cours. */
  piste.addEventListener("click",e=>{
    if(Geste.pince) return;
    if(!e.target.closest(".bloc") && !e.target.closest(".poignee") && E.blocSelectionne){
      E.blocSelectionne=null; rendre();
    }
  });

  /* Toucher ou balayer la règle déplace la lecture : sans cela, les deux
     boutons de bout en bout sont la seule navigation possible. */
  const regle=piste.querySelector(".regle");
  if(regle){
    const viser = e=>{
      const r=piste.getBoundingClientRect();
      const t=Math.max(0, Math.min(dureeTotale(), (e.clientX-r.left+defil.scrollLeft)/echelle()));
      arreterLecture(); E.lecture={t};
      peindreApercu(t); majTete(t);
      const l=document.getElementById("tLect");
      if(l) l.textContent=tpsD(t)+" / "+tpsD(dureeTotale());
    };
    regle.addEventListener("pointerdown",e=>{
      e.preventDefault();
      try{ regle.setPointerCapture(e.pointerId); }catch(err){}
      viser(e);
      const mv=e2=>viser(e2);
      const up=()=>{
        regle.removeEventListener("pointermove",mv);
        regle.removeEventListener("pointerup",up);
        regle.removeEventListener("pointercancel",up);
        rendre();
      };
      regle.addEventListener("pointermove",mv);
      regle.addEventListener("pointerup",up);
      regle.addEventListener("pointercancel",up);
    });
  }

  document.querySelectorAll("[data-prec]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const n=btn.dataset.prec;
      E.echellePxS = echelleMinimale() * POURCENTAGES[n];
      rendre();
    });
  });
}

  const A = E.attenteLecture || {};

    corps:`
      <div class="legende" style="padding:10px 0 0">

      <div class="micro">Fichier</div>
      <div style="font-size:17px">${esc(A.nom||"")}</div>
      ${secondes?`<div class="legende num" style="padding-top:6px">Environ ${secondes} s d'analyse.</div>`:""}
      ${p!=null?`<div class="jauge" style="margin-top:22px"><i style="width:${p}%"></i></div>

    corps:`<div id="zoneAppar">${apercu(0,{h:300,st:ex,zoom:false,badge:"Taille "+niveauTaille()+" sur 6"})}</div>
      <div class="legende" style="padding-top:8px">Faites glisser le texte dans l'aperçu pour le placer.</div>
      <div class="micro">Taille</div>
      <input type="range" min="4" max="9" step="1" value="${st.taillePct}" data-in="taille">
      <div class="micro">Couleur</div>
      <div class="pastilles">${cs.map(([c,n])=>`<button class="pastille" data-set="couleur:${c}" aria-pressed="${st.couleur===c}"
        style="background:${c};box-shadow:inset 0 0 0 1px var(--bord)" aria-label="${n}"></button>`).join("")}</div>
      <div class="micro">Police</div>
      <div class="duo">
        <button class="secondaire" data-set="police:sans" style="${st.police==="sans"?"border-color:var(--accent);border-width:2px":""}">Sans</button>
        <button class="secondaire" data-set="police:serif" style="font-family:Georgia,serif;${st.police==="serif"?"border-color:var(--accent);border-width:2px":""}">Serif</button>
        <button class="secondaire" data-set="police:grasse" style="font-weight:800;${st.police==="grasse"?"border-color:var(--accent);border-width:2px":""}">Grasse</button>
      </div>
      <button class="destructif" style="margin-top:18px" data-act="replacer">Replacer en bas au centre</button>`,
  };
};
const niveauTaille = () => E.projet.style.taillePct-3;

EC.exporter = () => {
  const P=E.projet, nV=P.paragraphes.filter(p=>!p.cale).length;
  if(E.ctx.exportFini) return {
    barre:{titre:""},
    corps:`<h1 style="padding-top:120px">Terminé.</h1><div style="font-size:19px">Vidéo enregistrée dans la galerie.</div>`,
    pied:`<button class="principal" data-act="finExport">Revenir au montage</button>`,
  };
  const p=E.ctx.exportPct;
  return {
    barre:{g:`<button data-act="retour">Retour</button>`,titre:"Exporter"},
    corps:`<h1>Prêt à exporter.</h1>
      <div class="recap"><b>Durée</b><span class="num">${tpsD(dureeTotale())}</span></div>
      <div class="recap"><b>Clips</b><span class="num">${P.clips.length}</span></div>
      <div class="recap"><b>Bandes son</b><span class="num">${P.audios.length}</span></div>
      <div class="recap"><b>Sous-titres</b><span class="num">${P.sousTitres.length}</span></div>
      <div class="recap"><b>Format</b><span class="num">1080 × 1920</span></div>
      ${nV?`<div class="legende" style="padding-top:14px">${nV} passage${nV>1?"s":""} non vérifié${nV>1?"s":""}.</div>`:""}
      ${p!==undefined?`<div class="jauge" style="margin-top:24px"><i style="width:${p}%"></i></div>
        <div class="legende num">Export en cours… ${p} %</div>`:""}`,
    pied:`<button class="principal" data-act="lancerExport" ${p!==undefined?"disabled":""}>Exporter la vidéo</button>`,
  };
};

/* ---------- 7. Rendu ----------------------------------------------------- */

function rendre(anim){
  const nom = E.pile[E.pile.length-1];
  const v = EC[nom]();
  const b = v.barre||{};
  document.getElementById("tel").innerHTML = `
    <div class="ecran ${anim?"entre":""}">
      <div class="barre"><div class="g">${b.g||""}</div><div class="titre">${b.titre||""}</div><div class="d">${b.d||""}</div></div>
      <div class="corps ${v.sansmarge?"sansmarge":""}">${v.corps||""}</div>
      ${v.pied?`<div class="pied">${v.pied}</div>`:""}
      ${E.toast?`<div class="toast">${esc(E.toast)}</div>`:""}
    </div>`;
  brancher();
  if(document.getElementById("apMedia")) monterMedia(E.lecture?E.lecture.t:0);
  if(nom==="montage"||nom==="verif") brancherGlisse();
  if(nom==="apparence") brancherPlacement();
  // Le pincement du montage lui-même n'existe qu'une fois le plein écran actif.
  if(E.pleinEcran && document.getElementById("boutonPlein")) brancherPinceApercu();
}

function brancher(){
  const tel=document.getElementById("tel");
  tel.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>{
    const [e,arg]=el.dataset.go.split(":");
    if(e==="editST") aller("editST",{stId:arg}); else aller(e);
  }));
  tel.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",()=>acte(el.dataset.act)));
  tel.querySelectorAll("[data-set]").forEach(el=>el.addEventListener("click",()=>{
    const [k,v]=el.dataset.set.split(":");
    if(k==="zS") E.ctx.zS=v;
    else agir("Changement d'apparence",()=>{ E.projet.style[k]=v; if(k==="police") regenerer(); });
    rendre();
  }));
  tel.querySelectorAll("[data-in]").forEach(el=>{
    const ev = el.tagName==="TEXTAREA" ? "input" : "input";
    el.addEventListener(ev,()=>saisie(el.dataset.in, el.value, el));
  });
  tel.querySelectorAll("[data-voix]").forEach(el=>el.addEventListener("change",()=>{E.ctx.voix=el.dataset.voix;}));
  tel.querySelectorAll("[data-para]").forEach(el=>el.addEventListener("click",()=>{
    E.ctx.paraActif=el.dataset.para; arreterLecture();
    const p=E.projet.paragraphes.find(x=>x.id===el.dataset.para);
    E.lecture={t:Math.max(0,p.debut-0.4)}; lancerLecture(); rendre();
  }));
}

function saisie(champ,val,el){
  const n=parseFloat(val);
  if(champ==="coupe"){ E.ctx.coupe=n; majTexteProche(el,tpsD(n)); return; }
  if(champ==="rA"||champ==="rB"){
    const c=E.projet.clips.find(x=>x.id===E.ctx.clipId), d=c.fin-c.debut, min=d*0.08;
    let a=E.ctx.rA??0, b=E.ctx.rB??d;
    if(champ==="rA"){ a=Math.min(n,b-min); } else { b=Math.max(n,a+min); }
    E.ctx.rA=Math.max(0,a); E.ctx.rB=Math.min(d,b); rendre(); return;
  }
  if(champ==="zA"){ E.ctx.zA=n; rendre(); return; }
  if(champ==="taille"){
    agir("Changement de taille",()=>{ E.projet.style.taillePct=n; regenerer(); }); return;
  }
  if(champ==="texte"){ E.ctx.texte=val; return; }
  if(champ==="autoTexte"){ E.auto=Object.assign(E.auto||{sequences:[],medias:[]},{texte:val}); return; }
  if(champ==="stTexte"){ const s=E.projet.sousTitres.find(x=>x.id===E.ctx.stId); if(s) s.texte=val; return; }
}
function majTexteProche(el,txt){ const d=el.parentElement.querySelector("div.num"); if(d) d.textContent=txt; }

/* ---------- 8. Actions --------------------------------------------------- */

function acte(a){
  const [nom,arg,arg2,arg3]=a.split(":");
  const P=E.projet;

  if(nom==="retour") return retour();
  if(nom==="stopCalage"){ clearInterval(E.calageT); E.calageT=null; E.pile.pop(); return rendre(); }
  if(nom==="annuler") return annuler();

  if(nom==="importer"){
    choisirFichier("video/*,.mp4,.mov,.m4v", true, async files=>{
      const ajouts=[];
      for(const f of files){
        try{
          const url=URL.createObjectURL(f);
          const v=document.createElement("video");
          v.src=url; v.preload="auto"; v.playsInline=true; v.muted=false;
          const duree = await new Promise((res,rej)=>{
            v.addEventListener("loadedmetadata",()=>res(v.duration),{once:true});
            v.addEventListener("error",()=>rej(new Error()),{once:true});
            setTimeout(()=>rej(new Error()),12000);
          });
          const id="c"+Date.now()+"_"+ajouts.length;
          MEDIA.videos[id]=v;
          ajouts.push({id,nom:f.name,debut:0,fin:duree,finMax:duree,zoomAmplitude:0,zoomSens:"avant"});
        }catch(e){ /* fichier illisible : ignoré */ }
      }
      if(!ajouts.length){ toast("Aucune vidéo lisible."); return; }
      agir("Import de vidéo",()=>{
        P.clips.push(...ajouts);
        E.toastEnAttente = ajouts.length+" vidéo"+(ajouts.length>1?"s importées":" importée")+".";
      });
    });
    return;
  }

  if(nom==="supprimerClip") return agir("Suppression du clip",()=>{
    P.clips=P.clips.filter(c=>c.id!==E.ctx.clipId); E.pile.pop();
  });

  if(nom==="couperIci"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId), i=P.clips.indexOf(c);
    const t=E.ctx.coupe ?? (c.fin-c.debut)/2;
    return agir("Coupe",()=>{
      const b={...c,id:"c"+Date.now(),debut:c.debut+t};
      c.fin=c.debut+t; P.clips.splice(i+1,0,b); E.ctx.coupe=undefined; E.pile=["montage"];
    });
  }
  if(nom==="raccourcirOK"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId), d0=c.debut;
    const a2=E.ctx.rA??0, b2=E.ctx.rB??(c.fin-c.debut);
    return agir("Raccourci",()=>{ c.fin=d0+b2; c.debut=d0+a2; E.ctx.rA=E.ctx.rB=undefined; E.pile.pop(); });
  }
  if(nom==="zoomOK"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId);
    return agir("Zoom",()=>{ c.zoomAmplitude=E.ctx.zA??c.zoomAmplitude; c.zoomSens=E.ctx.zS??c.zoomSens;
      E.ctx.zA=E.ctx.zS=undefined; E.pile.pop(); });
  }

  if(nom==="ajouterSon"){
    choisirFichier("audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.mp4,.mov", false, async file=>{
      toast("Analyse de « "+file.name+" »…");
      try{
        const {env,duree} = await analyserAudio(file, e=>toast(e+"…"));
        const id="a"+Date.now();
        MEDIA.sons[id] = Object.assign(new Audio(URL.createObjectURL(file)),{preload:"auto"});
        agir("Ajout d'une bande son",()=>{
          P.audios.push({id,nom:file.name,duree,dureeSource:duree,debut:0,decalage:0,env,url:true});
          E.toastEnAttente = file.name+" ajouté, "+tpsD(duree)+".";
        });
      }catch(e){
        E.attenteLecture = {file, nom:file.name, duree:null, progres:null, suite:"son"};
        E.pile.push("analyseLecture"); rendre();
      }
    });
    return;
  }
  if(nom==="retirerSon") return agir("Retrait de la bande son",()=>{
    P.audios=P.audios.filter(x=>x.id!==arg); if(P.voixOffId===arg) P.voixOffId=null;
  });

  if(nom==="calerTexte"){
    const txt = E.ctx.texte ?? (P.texteSource || TEXTE_DEMO);
    if(!txt.trim()){ toast("Collez d'abord votre texte."); return rendre(); }
    const voix = E.ctx.voix ?? (P.audios[0]&&P.audios[0].id);
    E.pile.push("encours"); rendre();
    let pct=0;
    const etapes=["Analyse des respirations","Répartition du texte","Découpage des lignes"];
    const it=setInterval(()=>{
      if(E.calageT!==it) return; // calage abandonné
      pct+=7+Math.random()*9;
      const j=document.getElementById("jauge"), jt=document.getElementById("jaugeTxt");
      if(j) j.style.width=Math.min(100,pct)+"%";
      if(jt) jt.textContent=etapes[Math.min(2,Math.floor(pct/34))];
      if(pct>=100){
        clearInterval(it); E.calageT=null;
        agir("Calage",()=>{
          const bande = P.audios.find(a=>a.id===voix) || P.audios[0];
          const r=caler(txt, bande && bande.env);
          if(!r){ E.pile=["montage","soustitres"]; E.toastEnAttente="Calage impossible : texte ou bande son manquants."; return; }
          const dec = bande ? (bande.decalage - (bande.debut||0)) : 0; // source -> montage
          r.paragraphes.forEach(p=>{ p.debut+=dec; p.fin+=dec; });
          P.texteSource=txt; P.voixOffId=voix;
          P.paragraphes=r.paragraphes; E.pauses=r.pauses; E.compteRendu=r.compteRendu;
          P.sousTitres=P.sousTitres.filter(s=>!s.paragrapheId);
          regenerer();
          E.ctx.texte=undefined; E.ctx.paraActif=null;
          E.pile=["montage","soustitres","verif"];
        });
      }
    },140);
    E.calageT=it;
    return;
  }

  if(nom==="commenceIci"){
    const p=P.paragraphes.find(x=>x.id===E.ctx.paraActif); if(!p) return;
    const t=E.lecture?E.lecture.t:p.debut;
    return agir("Recalage",()=>{
      const ecart=t-p.debut, i=P.paragraphes.indexOf(p);
      P.paragraphes.forEach((q,k)=>{ if(k>=i){ q.debut+=ecart; q.fin+=ecart; } });
      p.cale=true; regenerer();
      E.toastEnAttente="Passage recalé, la suite a suivi.";
    });
  }

  if(nom==="pleinEcran"){
    E.pleinEcran=!E.pleinEcran; E.zoomAp={scale:1}; // le pincement ne survit pas à l'entrée/sortie
    return rendre();
  }
  if(nom==="annulerLecture"){
    E.attenteLecture=null; E.autoAbandonne=true;
    E.pile = (E.auto ? ["montage","autoTexte"] : ["montage","sons"]);
    return rendre();
  }

  if(nom==="lancerLecture"){
    const A=E.attenteLecture; if(!A || A.progres!=null) return;
    A.progres=0; rendre(); // l'appui en cours démarre le contexte audio
    analyserParLecture(A.file, pr=>{
      if(!E.attenteLecture) return;
      E.attenteLecture.progres=pr;
      const j=document.querySelector(".jauge i");
      if(j) j.style.width=Math.round(pr*100)+"%";
      const l=[...document.querySelectorAll(".legende")].find(x=>/Analyse en cours/.test(x.textContent));
      if(l) l.textContent="Analyse en cours… "+Math.round(pr*100)+" %";
    }).then(({env,duree})=>{
      if(!E.attenteLecture) return;
      const suite=E.attenteLecture.suite, file=E.attenteLecture.file, nom2=E.attenteLecture.nom;
      E.attenteLecture=null;
      const id="a"+Date.now();
      MEDIA.sons[id]=Object.assign(new Audio(URL.createObjectURL(file)),{preload:"auto"});
      if(suite==="auto"){
        const sq=sequencerAudio(env);
        E.auto=Object.assign(E.auto||{},{
          audio:{id,nom:nom2,duree,env}, ...sq,
          medias:new Array(sq.sequences.length).fill(null),
        });
        E.pile=["montage","autoMedias"]; rendre();
      } else {
        agir("Ajout d'une bande son",()=>{
          E.projet.audios.push({id,nom:nom2,duree,dureeSource:duree,debut:0,decalage:0,env,url:true});
          E.pile=["montage","sons"];
          E.toastEnAttente=nom2+" ajouté, "+tpsD(duree)+".";
        });
      }
    }).catch(err=>{
      if(!E.attenteLecture) return;
      const suite=E.attenteLecture.suite;
      E.attenteLecture=null;
      E.pile = suite==="auto" ? ["montage","autoTexte"] : ["montage","sons"];
      rendre();
      toast("Analyse impossible : "+(err && err.message ? err.message : "fichier non exploitable")+".");
    });
    return;
  }

  if(nom==="quitterAuto"){ E.auto=null; E.pile=["montage"]; return rendre(true); }
  if(nom==="stopAuto"){
    E.autoAbandonne=true; // l'analyse en cours ne doit plus rien afficher
    E.pile = (E.auto && E.auto.sequences) ? ["montage","autoMedias"] : ["montage","autoTexte"];
    return rendre();
  }

  if(nom==="autoChoisirSon"){
    const txt = (E.auto && E.auto.texte) || "";
    if(!txt.trim()){ toast("Collez d'abord votre texte."); return; }
    // Une vidéo est acceptée : seule sa piste audio est analysée.
    choisirFichier("audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.mp4,.mov", false, async file=>{
      E.autoAbandonne=false;
      E.pile.push("autoEnCours"); rendre();
      let pct=15;
      const etape = libelle=>{
        if(E.autoAbandonne) return;
        pct=Math.min(85,pct+25);
        const j=document.getElementById("jaugeAuto"); if(j) j.style.width=pct+"%";
        const t=document.getElementById("jaugeAutoTxt"); if(t) t.textContent=libelle;
      };
      try{
        const {env,duree} = await analyserAudio(file, etape);
        if(E.autoAbandonne) return; // l'utilisateur est parti : ne rien imposer
        const sq = sequencerAudio(env);
        const id="a"+Date.now();
        MEDIA.sons[id]=Object.assign(new Audio(URL.createObjectURL(file)),{preload:"auto"});
        E.auto = Object.assign(E.auto||{}, {
          texte:txt, audio:{id,nom:file.name,duree,env}, ...sq,
          medias:new Array(sq.sequences.length).fill(null),
        });
        E.pile=["montage","autoMedias"]; rendre();
      }catch(e){
        if(E.autoAbandonne) return;
        // Le décodage direct a échoué : la lecture accélérée reste possible,
        // mais elle exige un appui pour démarrer le son.
        E.attenteLecture = {file, nom:file.name, duree:null, progres:null, suite:"auto"};
        E.pile=["montage","analyseLecture"]; rendre();
      }
    });
    return;
  }

  if(nom==="autoMedia"){
    const i=parseInt(arg,10);
    choisirFichier("video/*,image/*", false, async file=>{
      const estImage = /^image\//.test(file.type);
      const url=URL.createObjectURL(file);
      try{
        if(estImage){
          const im=document.createElement("img");
          im.src=url; im.alt="";
          await new Promise((res,rej)=>{
            im.addEventListener("load",res,{once:true});
            im.addEventListener("error",rej,{once:true});
            setTimeout(rej,12000);
          });
          E.auto.medias[i]={kind:"image", nom:file.name, el:im, duree:Infinity};
        } else {
          const v=document.createElement("video");
          v.src=url; v.preload="auto"; v.playsInline=true;
          const duree=await new Promise((res,rej)=>{
            v.addEventListener("loadedmetadata",()=>res(v.duration),{once:true});
            v.addEventListener("error",rej,{once:true});
            setTimeout(rej,12000);
          });
          E.auto.medias[i]={kind:"video", nom:file.name, el:v, duree};
        }
        rendre();
      }catch(e){ toast("Ce fichier n'a pas pu être lu."); }
    });
    return;
  }

  if(nom==="autoMonter"){
    const A=E.auto;
    if(!A || A.medias.some(m=>!m)) return;
    E.pile.push("autoEnCours"); rendre();
    const jt=document.getElementById("jaugeAutoTxt");
    if(jt) jt.textContent="Calage des sous-titres";
    const j=document.getElementById("jaugeAuto"); if(j) j.style.width="60%";

    setTimeout(()=>{
      agir("Montage automatique", ()=>{
        const env=A.audio.env;

        /* Les clips sont lus bout à bout : pour que l'image reste synchrone
           avec la voix, ils doivent couvrir TOUTE la durée, silences compris.
           On coupe donc au milieu de chaque silence — le silence est bien la
           transition, et chaque plan en porte la moitié. */
        const coupes=[0];
        for(const sil of A.silences) coupes.push((sil.debut+sil.fin)/2);
        coupes.push(env.duree);

        const clips=[]; const avertissements=[];
        A.sequences.forEach((sq,i)=>{
          const m=A.medias[i];
          const besoin=coupes[i+1]-coupes[i];
          const id="c"+Date.now()+"_"+i;
          if(m.kind==="image"){
            MEDIA.images[id]=m.el;
            // Zoom lent systématique : une image figée décroche l'attention.
            clips.push({id,nom:m.nom,debut:0,fin:besoin,finMax:besoin,
              zoomAmplitude:15,zoomSens: i%2 ? "arriere":"avant"});
          } else {
            // Illustration d'une voix off : le son du média doublerait la
            // récitation. Les vidéos importées à la main gardent le leur.
            m.el.muted=true;
            MEDIA.videos[id]=m.el;
            const garde=Math.min(m.duree,besoin);
            if(m.duree<besoin-0.05)
              avertissements.push(`la séquence ${i+1} dure ${besoin.toFixed(1)} s mais son média n'en fait que ${m.duree.toFixed(1)}`);
            clips.push({id,nom:m.nom,debut:0,fin:garde,finMax:m.duree,
              zoomAmplitude:0,zoomSens:"avant"});
          }
        });

        const P=E.projet;
        P.clips=clips;
        P.audios=[{id:A.audio.id,nom:A.audio.nom,duree:A.audio.duree,
          dureeSource:A.audio.duree,debut:0,decalage:0,env,url:true}];
        P.voixOffId=A.audio.id;
        P.texteSource=A.texte;
        P.paragraphes=[];
        P.style.x=50; P.style.y=84; // sous-titres toujours au même endroit, en bas

        const textes=sousTitresDuTexte(A.texte,P.style.taillePct,1080);
        const cales=calerSousTitresAuto(textes,A.pauses,env.duree,0,A.sequences);
        P.sousTitres=cales.map(c=>({id:"s"+Math.random().toString(36).slice(2),
          debut:c.debut,fin:c.fin,texte:c.texte,paragrapheId:null}));
        E.pauses=A.pauses;

        const nSeq=A.sequences.length;
        let phrase=`${nSeq} séquence${nSeq>1?"s":""} montée${nSeq>1?"s":""} sur `+
          `${A.silences.length} silence${A.silences.length>1?"s":""}, `+
          `${P.sousTitres.length} sous-titres de 7 mots au plus.`;
        if(avertissements.length) phrase+=" À vérifier : "+avertissements.join(" ; ")+".";
        E.compteRendu={total:0,surPause:0,estimees:0,ecart:0,phrase};
        E.toastEnAttente=phrase;
        E.auto=null; E.pile=["montage"]; E.lecture={t:0};
      });
    },220);
    return;
  }

  if(nom==="debut"){ arreterLecture(); E.lecture={t:0}; rendre(); assurerVisible("debut"); return; }
  if(nom==="fin"){ arreterLecture(); E.lecture={t:Math.max(0,dureeTotale()-0.05)}; rendre(); assurerVisible("fin"); return; }
  if(nom==="lire"||nom==="lecture"){
    amorcerVideos(); // cet appui est le seul moment où iOS l'autorise
    if(enLecture()) arreterLecture();
    else { if(!E.lecture||E.lecture.t>=dureeTotale()-0.05) E.lecture={t:0}; lancerLecture(); }
    return rendre();
  }

  if(nom==="redecouper"){
    const np=P.paragraphes.length, nc=P.clips.length;
    const msg = np===nc ? np+" paragraphes pour "+nc+" clips — chaque clip couvrira son paragraphe."
      : np>nc ? np+" paragraphes pour "+nc+" clips — les clips seront réutilisés en boucle."
      : np+" paragraphes pour "+nc+" clips — les clips en trop sont conservés à la fin.";
    if(!confirm(msg+"\n\nValider ?")) return;
    return agir("Découpage des plans",()=>{
      const neufs=[];
      P.paragraphes.forEach((p,i)=>{
        const src=P.clips[i%P.clips.length];
        neufs.push({...src,id:"c"+i+"_"+Date.now(),debut:0,fin:Math.max(.3,p.fin-p.debut)});
      });
      if(P.clips.length>P.paragraphes.length) neufs.push(...P.clips.slice(P.paragraphes.length));
      P.clips=neufs; E.pile=["montage"];
    });
  }

  if(nom==="srt"){
    if(arg==="parcourir") return toast("Sélecteur de fichiers de l'appareil.");
    const n = arg==="recitation-v3.srt" ? 47 : 12;
    if(!confirm("Remplacer les sous-titres existants ?")) return;
    return agir("Import .srt",()=>{
      P.sousTitres=[]; P.paragraphes=[]; E.compteRendu=null;
      let t=1.2;
      for(let i=0;i<n;i++){ const d=1.1+Math.random()*1.4;
        P.sousTitres.push({id:"i"+i,debut:t,fin:t+d,texte:"Entrée "+(i+1)+" du fichier",paragrapheId:null}); t+=d+.25; }
      E.pile=["montage"];
      E.toastEnAttente=n+" sous-titres importés depuis "+arg;
    });
  }

  if(nom==="ajouterST") return agir("Ajout d'un sous-titre",()=>{
    const s={id:"m"+Date.now(),debut:0,fin:2,texte:"Nouveau sous-titre",paragrapheId:null};
    P.sousTitres.push(s); P.sousTitres.sort((a,b)=>a.debut-b.debut);
    E.pile.push("editST"); E.ctx.stId=s.id;
  });
  if(nom==="dec"){
    const s=P.sousTitres.find(x=>x.id===arg); if(!s) return;
    return agir("Minutage",()=>{
      const d=parseInt(arg3,10)*0.2;
      if(arg2==="debut") s.debut=Math.max(0,Math.min(s.debut+d,s.fin-0.2));
      else s.fin=Math.max(s.debut+0.2,s.fin+d);
      P.sousTitres.sort((a,b)=>a.debut-b.debut);
    });
  }
  if(nom==="supprimerST") return agir("Suppression",()=>{
    P.sousTitres=P.sousTitres.filter(x=>x.id!==arg); E.pile.pop();
  });

  if(nom==="replacer") return agir("Replacement",()=>{
    P.style.x=50; P.style.y=84; P.style.taillePct=7; regenerer();
  });

  if(nom==="lancerExport"){
    E.ctx.exportPct=0; rendre();
    const it=setInterval(()=>{
      E.ctx.exportPct=Math.min(100,E.ctx.exportPct+4+Math.random()*6);
      if(E.ctx.exportPct>=100){ clearInterval(it); E.ctx.exportPct=undefined; E.ctx.exportFini=true; }
      rendre();
    },130);
    return;
  }
  if(nom==="finExport"){ E.ctx.exportFini=false; E.pile=["montage"]; return rendre(true); }
}

/* ---------- 9. Lecture pour la vérification ------------------------------ */

function medias(){
  const out=[];
  for(const a of E.projet.audios){
    const el=MEDIA.sons[a.id];
    if(el) out.push({el, debut:a.decalage, fin:a.decalage+a.duree, entree:a.debut||0});
  }
  return out;
}
function synchroniserMedias(t, force){
  for(const m of medias()){
    const dedans = t>=m.debut && t<m.fin;
    if(dedans){
      const local = t-m.debut+m.entree; // le point d'entrée décale la lecture dans le fichier
      if(force || Math.abs(m.el.currentTime-local)>0.25){ try{ m.el.currentTime=local; }catch(e){} }
      if(enLecture() && m.el.paused) m.el.play().catch(()=>{});
      if(!enLecture() && !m.el.paused) m.el.pause();
    } else if(!m.el.paused) m.el.pause();
  }
}
function arreterMedias(){
  for(const m of medias()) if(!m.el.paused) m.el.pause();
  for(const id in MEDIA.videos){ const v=MEDIA.videos[id]; if(!v.paused) v.pause(); }
}

/* La bande doit suivre les trois commandes de lecture, pas juste la tête qui
   avance dans le vide : un rendu complet recrée #defil à scrollLeft=0, donc
   sans ceci « Aller à la fin » laisse le début affiché pendant que la tête
   de lecture est hors champ, loin à droite. */
function assurerVisible(cible){
  const defil=document.getElementById("defil"), piste=document.getElementById("piste");
  if(!defil||!piste) return;
  if(cible==="debut"){ defil.scrollLeft=0; return; }
  if(cible==="fin"){ defil.scrollLeft=Math.max(0, piste.scrollWidth-defil.clientWidth); return; }
  const x=cible*echelle(), marge=40;
  if(x < defil.scrollLeft+marge) defil.scrollLeft=Math.max(0,x-marge);
  else if(x > defil.scrollLeft+defil.clientWidth-marge) defil.scrollLeft=x-defil.clientWidth+marge;
}

function lancerLecture(){
  arreterLecture();
  if(!E.lecture) E.lecture={t:0};
  const fin = dureeTotale();
  E.lecture.actif = true;
  E.lecture.horloge = (typeof performance!=="undefined"?performance.now():Date.now()) - E.lecture.t*1000;
  synchroniserMedias(E.lecture.t, true);
  const maintenant = ()=> (typeof performance!=="undefined"?performance.now():Date.now());
  const boucle = ()=>{
    if(!E.lecture || !E.lecture.actif) return;
    E.lecture.t = (maintenant()-E.lecture.horloge)/1000;
    if(E.lecture.t>=fin){ E.lecture.t=fin; arreterLecture(); rendre(); return; }
    synchroniserMedias(E.lecture.t);
    peindreApercu(E.lecture.t);
    majTete(E.lecture.t);
    assurerVisible(E.lecture.t);
    const l=document.getElementById("tLect");
    if(l) l.textContent = tpsD(E.lecture.t)+" / "+tpsD(fin);
    const l2=document.getElementById("tLectPlein");
    if(l2) l2.textContent = tpsD(E.lecture.t)+" / "+tpsD(fin);
    E.lecture.raf = requestAnimationFrame(boucle);
  };
  E.lecture.raf = requestAnimationFrame(boucle);
}
function arreterLecture(){
  if(E.lecture){
    E.lecture.actif=false;
    if(E.lecture.raf){ cancelAnimationFrame(E.lecture.raf); E.lecture.raf=null; }
  }
  arreterMedias();
}

/* ---------- 10. Placement au doigt (4.7) --------------------------------- */

function brancherPlacement(){
  const zone=document.getElementById("zoneAppar"); if(!zone) return;
  const cadre=zone.querySelector(".neuf16"); const t=zone.querySelector(".st"); if(!cadre||!t) return;
  t.style.pointerEvents="auto"; t.style.cursor="grab";
  t.addEventListener("pointerdown",ev=>{
    ev.preventDefault(); t.setPointerCapture(ev.pointerId);
    const bouger=e2=>{
      const r=cadre.getBoundingClientRect();
      const x=Math.max(8,Math.min(92,(e2.clientX-r.left)/r.width*100));
      const y=Math.max(22,Math.min(98,(e2.clientY-r.top)/r.height*100));
      E.projet.style.x=x; E.projet.style.y=y;
      t.style.left=x+"%"; t.style.top=y+"%";
    };
    const finir=()=>{ t.removeEventListener("pointermove",bouger); t.removeEventListener("pointerup",finir); };
    t.addEventListener("pointermove",bouger); t.addEventListener("pointerup",finir);
  });
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && E.pleinEcran){ E.pleinEcran=false; E.zoomAp={scale:1}; rendre(); }
});

/* ---------- Pincement du montage lui-même : uniquement en plein écran ---- */
const GesteAp = { actifs:new Map(), dist0:0 };

function brancherPinceApercu(){
  const cadre=document.getElementById("apCadre"); if(!cadre) return;
  GesteAp.actifs.clear();
  const distance=()=>{
    const pts=[...GesteAp.actifs.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  };
  cadre.addEventListener("pointerdown",e=>{
    GesteAp.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(GesteAp.actifs.size===2) GesteAp.dist0=distance();
  });
  cadre.addEventListener("pointermove",e=>{
    if(!GesteAp.actifs.has(e.pointerId)) return;
    GesteAp.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(GesteAp.actifs.size===2 && GesteAp.dist0>0){
      const d=distance();
      const echelleNouvelle = Math.max(1, Math.min(3, (E.zoomAp.scale||1) * (d/GesteAp.dist0)));
      GesteAp.dist0=d;
      E.zoomAp.scale=echelleNouvelle;
      const z=document.getElementById("apZoom");
      if(z) z.style.transform="scale("+echelleNouvelle.toFixed(3)+")";
    }
  });
  const relacher=e=>{
    GesteAp.actifs.delete(e.pointerId);
    if(GesteAp.actifs.size<2) GesteAp.dist0=0;
  };
  cadre.addEventListener("pointerup",relacher);
  cadre.addEventListener("pointercancel",relacher);
}

/* ---------- démarrage ---------------------------------------------------- */
rendre();

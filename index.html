<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>Coupe</title>
<style>
  :root{
    --fond:#F6F5F1; --hors:#EDEBE5; --encre:#14140F; --accent:#0B7D70; /* vert d'eau */
    --gris:#8A887F; --sep:#E2E0D8; --bord:#DAD7CD; --clip:#DEDCD3; --image:#CBC8BE;
    --marge:20px; --rayon:14px; --padBande:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;touch-action:manipulation} /* pas de pincement ni de double-appui : seules la bande de montage et l'aperçu en plein écran gèrent eux-mêmes le pincement */
  body{
    background:var(--hors); color:var(--encre);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:17px; line-height:1.45;
    display:flex; align-items:center; justify-content:center;
  }
  .tel{
    width:390px; height:844px; max-height:100vh; background:var(--fond);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 24px 60px rgba(20,20,15,.16);
  }
  @media(max-width:430px){ .tel{width:100vw;height:100vh;box-shadow:none} body{align-items:stretch} }

  /* ---- structure d'écran ---- */
  .ecran{position:absolute;inset:0;background:var(--fond);display:flex;flex-direction:column}
  .ecran.entre{animation:glisse .2s ease-out}
  @keyframes glisse{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
  .barre{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:14px var(--marge) 10px;gap:8px;flex:none;
  }
  .barre .g{justify-self:start} .barre .d{justify-self:end}
  .barre button{background:none;border:0;padding:8px 0;font:inherit;font-size:17px;color:var(--accent);cursor:pointer;min-height:44px}
  .barre .titre{font-size:16px;font-weight:700;white-space:nowrap}
  .corps{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--marge) 24px}
  .corps.sansmarge{padding-left:0;padding-right:0}
  .pied{flex:none;padding:12px var(--marge) calc(12px + env(safe-area-inset-bottom))}
  h1{font-size:26px;font-weight:700;margin:2px 0 16px;letter-spacing:-.3px}
  .legende{font-size:13px;color:var(--gris);line-height:1.4}
  .micro{font-size:13px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--gris);margin:22px 0 8px}
  .sep{height:1px;background:var(--sep);border:0;margin:0}
  .vide{color:var(--gris);font-size:17px;padding:18px 0}
  .num{font-variant-numeric:tabular-nums}

  /* ---- boutons ---- */
  .principal{
    display:block;width:100%;height:64px;border:0;border-radius:var(--rayon);
    background:var(--accent);color:#fff;font:600 20px/1 inherit;cursor:pointer;
  }
  .principal[disabled]{background:var(--bord);color:var(--gris);cursor:default}
  .secondaire{
    display:block;width:100%;min-height:64px;border:1px solid var(--bord);border-radius:var(--rayon);
    background:#fff;color:var(--encre);font:600 20px/1.3 inherit;cursor:pointer;padding:12px 16px;
  }
  .destructif{
    display:block;width:100%;min-height:44px;border:0;background:none;
    color:var(--gris);font:400 17px/1 inherit;cursor:pointer;padding:16px 0;text-align:center;
  }
  .rangee{
    display:flex;align-items:center;gap:12px;width:100%;min-height:60px;
    background:none;border:0;border-bottom:1px solid var(--sep);
    font:inherit;color:inherit;text-align:left;cursor:pointer;padding:12px 0;
  }
  .rangee .fleche{color:var(--gris);font-size:20px;margin-left:auto;flex:none}
  .rangee .cpt{color:var(--gris);margin-left:auto;flex:none}
  .duo{display:flex;gap:12px} .duo>*{flex:1}
  .ligneSon{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--sep);padding:12px 0}

  /* ---- aperçu 9:16 ---- */
  .cadre{background:var(--encre);border-radius:var(--rayon);display:flex;justify-content:center;position:relative;overflow:hidden}
  .cadre.pleinEcranActif{position:absolute;inset:0;z-index:55;border-radius:0}
  .neuf16{aspect-ratio:9/16;position:relative;overflow:hidden;background:var(--image)}
  .apZoom{position:absolute;inset:0;transform-origin:50% 50%}
  .btnPlein{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border:0;border-radius:8px;
    background:rgba(20,20,15,.55);color:#fff;font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .transportPlein{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:center;
    justify-content:center;gap:10px;touch-action:manipulation}
  .transportPlein button{flex:none;width:52px;height:48px;border:0;border-radius:12px;
    background:rgba(20,20,15,.55);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .transportPlein button.jouer{width:66px;font-size:19px}
  .transportPlein .tps{color:#fff;font-size:13px;font-variant-numeric:tabular-nums;
    position:absolute;bottom:56px;left:0;right:0;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .neuf16 .plan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:700 34px/1 inherit;color:#fff;mix-blend-mode:multiply;opacity:.55}
  .neuf16 .media{position:absolute;inset:0;transform-origin:50% 45%;overflow:hidden;background:var(--encre)}
  .neuf16 .media:empty{display:none}
  .neuf16 .media video,.neuf16 .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .st{position:absolute;transform:translate(-50%,-100%);text-align:center;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);line-height:1.18;white-space:pre-line;
    pointer-events:none;font-weight:600;max-width:84%}
  .st.serif{font-family:Georgia,"Times New Roman",serif}
  .st.grasse{font-weight:800;letter-spacing:-.5px}
  .horloge{position:absolute;top:8px;right:10px;background:rgba(20,20,15,.72);color:#fff;
    font:600 13px/1 inherit;padding:5px 7px;border-radius:6px}

  /* ---- bande de montage ---- */
  .bandeEnt{display:flex;justify-content:space-between;align-items:baseline;padding:0 var(--padBande);margin:0 0 4px}
  .bandeEnt .t{font-size:13px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--gris)}
  .bandeEnt .v{font-size:13px;color:var(--accent);font-weight:600}
  .defil{overflow-x:auto;overflow-y:hidden;padding:0 var(--padBande) 6px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
  .piste{position:relative;height:auto}
  .regle{height:20px;position:relative;border-bottom:1px solid var(--sep);margin-bottom:4px}
  .regle i{position:absolute;top:10px;width:1px;height:8px;background:var(--bord)}
  .regle span{position:absolute;top:-2px;font:400 11px/1 inherit;color:var(--gris);font-variant-numeric:tabular-nums}
  .rang{position:relative;height:44px;margin-bottom:4px}
  .rang.st{height:26px}
  /* Un bloc non sélectionné laisse passer le geste : c'est ce qui permet de
     faire défiler la page en swipant par-dessus les vidéos ou les sons sans
     les décaler par erreur. Il faut d'abord le toucher une fois pour le
     sélectionner ; ce n'est qu'alors qu'il devient une cible de glissement
     exclusive (touch-action:none, posé par .selectionne ci-dessous). */
  .bloc{position:absolute;top:0;bottom:0;border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;padding:0 8px;
    font:600 12px/1.2 inherit;cursor:pointer;touch-action:pan-x pan-y;user-select:none;will-change:transform}
  .bloc.clip{background:var(--clip);border:1px solid var(--bord)}
  .bloc.audio{background:var(--accent);color:#fff}
  .bloc.sst{background:var(--encre);color:#fff;font-weight:400;font-size:11px;height:30px;
    white-space:nowrap;text-overflow:ellipsis;display:block;line-height:28px}
  .bloc.sst.verif{box-shadow:inset 0 0 0 2px var(--accent)}
  .bloc .d{font-weight:400;color:var(--gris);font-size:11px}
  .bloc.audio .d{color:rgba(255,255,255,.8)}
  .bloc.selectionne{touch-action:none;cursor:grab;border:3px solid var(--accent);z-index:4}
  .bloc.saisi{opacity:.55;box-shadow:0 0 0 2px var(--accent);cursor:grabbing;z-index:6}
  /* Poignées en aplat de couleur d'accent, pas en calque translucide : sur un
     clip clair comme sur un fond sombre, elles doivent se voir immédiatement
     comme des éléments à part, jamais se confondre avec le bloc. */
  .poignee{position:absolute;top:3px;bottom:3px;width:30px;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;cursor:ew-resize;touch-action:none;z-index:7;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
  .poignee.g{left:3px;border-radius:7px}
  .poignee.d{right:3px;border-radius:7px}
  .bloc.sst .poignee{display:none}
  .bloc.audio .poignee{background:#fff;color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .tete{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:5;will-change:transform}
  .prec{display:flex;gap:6px;padding:2px var(--padBande) 0}
  .prec button{flex:1;min-height:44px;border:1px solid var(--bord);background:#fff;border-radius:10px;
    font:600 14px/1 inherit;color:var(--encre);cursor:pointer}
  .prec button[aria-pressed=true]{background:var(--encre);color:#fff;border-color:var(--encre)}
  .pas{padding:5px var(--padBande) 0 0;font-size:12px;color:var(--gris);font-variant-numeric:tabular-nums}
  .bandeCadre{margin:10px var(--marge) 0;background:var(--hors);border:1px solid var(--bord);
    border-radius:16px;padding:8px 0 7px;position:relative}
  .transport{display:flex;align-items:center;gap:10px;padding:6px var(--marge) 0}
  .transport button{flex:none;width:58px;height:52px;border:1px solid var(--bord);background:#fff;
    border-radius:12px;font:400 17px/1 inherit;color:var(--encre);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .transport button.jouer{background:var(--encre);color:#fff;border-color:var(--encre);width:76px;font-size:20px}
  .transport button:disabled{color:var(--bord);cursor:default}
  .transport .tps{margin-left:auto;color:var(--gris);font-size:15px;font-variant-numeric:tabular-nums}
  .regle{cursor:pointer;touch-action:none}

  /* ---- divers ---- */
  textarea{width:100%;min-height:220px;border:1px solid var(--bord);border-radius:var(--rayon);
    padding:14px;font:inherit;font-size:17px;background:#fff;resize:none;line-height:1.5}
  .choix{display:flex;flex-direction:column;gap:0}
  .choix label{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--sep);cursor:pointer}
  .choix input{width:22px;height:22px;accent-color:var(--accent)}
  .jauge{height:8px;background:var(--sep);border-radius:4px;overflow:hidden;margin:16px 0 10px}
  .jauge i{display:block;height:100%;background:var(--accent);width:0;transition:width .12s linear}
  .para{border-bottom:1px solid var(--sep);padding:14px 0;cursor:pointer}
  .para .h{display:flex;gap:10px;align-items:baseline}
  .para .tps{font-variant-numeric:tabular-nums;font-size:13px;color:var(--gris);flex:none}
  .para .marque{font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--accent);
    border-radius:6px;padding:1px 6px;flex:none;margin-left:auto}
  .para.actif{background:#fff;margin:0 -12px;padding:14px 12px;border-radius:12px}
  .para .lignes{margin-top:6px;font-size:15px;color:var(--gris)}
  .para .lignes div{padding:1px 0}
  .pastilles{display:flex;gap:12px;margin:10px 0}
  .pastille{width:52px;height:52px;border-radius:26px;border:2px solid transparent;cursor:pointer;padding:0}
  .pastille[aria-pressed=true]{border-color:var(--accent)}
  .badge{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,20,15,.8);
    color:#fff;font:600 13px/1 inherit;padding:7px 10px;border-radius:8px}
  .recap{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--sep);font-size:17px}
  .recap b{font-weight:400;color:var(--gris)} .recap span{font-variant-numeric:tabular-nums}
  .toast{position:absolute;left:var(--marge);right:var(--marge);bottom:24px;background:var(--encre);
    color:#fff;border-radius:12px;padding:14px 16px;font-size:15px;z-index:40;animation:glisse .2s}
  input[type=range]{width:100%;accent-color:var(--accent);height:44px}
  .curseurval{font:600 20px/1 inherit;margin:8px 0 2px}
</style>
</head>
<body>
<div class="tel" id="tel"></div>

<script>
"use strict";

/* Sur iOS Safari, le pincement natif de la PAGE peut passer outre touch-action
   pour ce geste précis. Chaque zone qui doit répondre au pincement — bande de
   montage, aperçu en plein écran — le fait elle-même via ses propres pointeurs ;
   le geste natif du navigateur n'a donc jamais de raison de s'activer. */
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
/* =========================================================================
   Coupe — prototype cliquable.
   Le découpage des lignes, les mots-outils, la répartition syllabique et le
   respect des silences sont le code réel. La vidéo et le décodage audio sont
   simulés : rectangles numérotés (autorisé en maquette, section 6) et
   enveloppe de synthèse à la place d'un vrai fichier.
   ========================================================================= */

/* ---------- 1. Texte : syllabes, mots-outils, découpage (4.6.5, 4.6.6) --- */

const VOY = "aeiouyàâäéèêëîïôöùûüÿœæ";
const RE_VOY = new RegExp("["+VOY+"]+","g");
const RE_E   = new RegExp("[^"+VOY+"]e$");
const RE_ES  = new RegExp("[^"+VOY+"]es$");
const RE_NL  = new RegExp("[^a-z"+VOY+"']","g");

function syllabesMot(mot){
  let m = mot.toLowerCase().normalize("NFC").replace(RE_NL,"");
  if(!m) return 0;
  m = m.replace(/qu/g,"k").replace(/gu(?=[eéèêi])/g,"g");
  const g = m.match(RE_VOY); if(!g) return 0;
  let n = g.length;
  if(n>1 && (RE_E.test(m)||RE_ES.test(m))) n--;
  return Math.max(1,n);
}
const mots = t => t.split(/\s+/).filter(Boolean);
const syllabes = t => mots(t).reduce((s,m)=>s+syllabesMot(m),0);

const OUTILS = new Set(("le la les un une des du de au aux ce cet cette ces mon ma mes ton ta tes son sa ses "+
"notre nos votre vos leur leurs quel quelle quels quelles tout toute tous toutes chaque aucun aucune "+
"à dans sur sous par pour avec sans chez vers entre contre depuis pendant avant après selon malgré "+
"jusqu jusque dès en parmi outre hors et ou mais donc or ni car que quand comme si lorsque puisque quoique afin "+
"je tu il elle on nous vous ils elles me te se lui y qui quoi dont où celui celle ceux celles moi toi soi eux "+
"ne pas plus très trop bien aussi encore déjà est sont était a ont avait sera seront").split(" "));

function estMotOutil(mot){
  const nu = mot.toLowerCase().normalize("NFC").replace(/[.,;:!?«»"()\[\]…]/g,"").trim();
  if(!nu) return false;
  if(/['’]$/.test(nu)) return true;
  return OUTILS.has(nu);
}
function ponct(mot){
  const f = mot.replace(/['’»")\]]+$/,"").slice(-1);
  if(".!?…".includes(f)) return "forte";
  if(",;:".includes(f)) return "faible";
  return null;
}

const LARG = {" ":.26,i:.24,j:.24,l:.24,I:.26,".":.26,",":.26,"'":.2,"’":.2,f:.3,t:.32,r:.34,m:.83,w:.72,M:.87,W:.9};
function mesure(txt,px){
  let e=0;
  for(const c of txt) e += LARG[c] ?? ((c===c.toUpperCase()&&c!==c.toLowerCase())?.62:.5);
  return e*px;
}

const COUT_LIGNE=12, COUT_OUTIL=400, B_FORTE=-14, B_FAIBLE=-8, POIDS=9;

/** Découpage optimal : toutes les coupures évaluées, jamais de remplissage glouton. */
function decouperLignes(para, taillePct, largeurImage, maxMots){
  const M = mots(para); const n = M.length; if(!n) return [];
  const px  = taillePct/100*largeurImage;
  const max = largeurImage*.84;
  const L = [];
  for(let i=0;i<n;i++){ L[i]=[]; for(let j=i+1;j<=n;j++) L[i][j]=mesure(M.slice(i,j).join(" "),px); }

  const cout = new Array(n+1).fill(Infinity), suiv = new Array(n+1).fill(-1);
  cout[n]=0;
  for(let i=n-1;i>=0;i--){
    for(let j=i+1;j<=n;j++){
      if(maxMots && j-i>maxMots) break; // plafond dur de mots par sous-titre
      const l=L[i][j];
      if(l>max && j>i+1) break;
      if(cout[j]===Infinity) continue;
      let c = COUT_LIGNE;
      const creux = Math.max(0,(max-l)/max); c += POIDS*creux*creux;
      const dern = M[j-1], derniere = (j===n);
      if(!derniere && estMotOutil(dern)) c += COUT_OUTIL;
      if(!derniere){ const p=ponct(dern); if(p==="forte")c+=B_FORTE; if(p==="faible")c+=B_FAIBLE; }
      if(c+cout[j] < cout[i]){ cout[i]=c+cout[j]; suiv[i]=j; }
    }
  }
  const out=[]; let i=0;
  while(i<n && suiv[i]>i){ out.push(M.slice(i,suiv[i]).join(" ")); i=suiv[i]; }
  if(i<n) out.push(M.slice(i).join(" "));
  return out;
}

/* ---------- 2. Audio réel : enveloppe, pauses, réglage automatique (4.6.2) ---
   Tout se passe sur l'appareil. decodeAudioData, une enveloppe en décibels par
   tranches de 20 ms, et une recherche sur 49 combinaisons. Aucun octet ne sort. */

const PLANCHER_DB = -100;

function enveloppeDepuisPCM(pcm, freq, pasMs){
  pasMs = pasMs||20;
  const taille = Math.max(1, Math.round(freq*pasMs/1000));
  const n = Math.floor(pcm.length/taille);
  const db = new Float32Array(n);
  for(let i=0;i<n;i++){
    let som=0; const d=i*taille;
    for(let k=0;k<taille;k++){ const v=pcm[d+k]; som+=v*v; }
    const rms=Math.sqrt(som/taille);
    db[i] = rms>0 ? Math.max(PLANCHER_DB, 20*Math.log10(rms)) : PLANCHER_DB;
  }
  return {pasMs, db, duree:n*pasMs/1000};
}

function reperes(env){
  const tri=Float32Array.from(env.db).sort();
  const pc = q => tri.length? tri[Math.min(tri.length-1,Math.max(0,Math.round(q*(tri.length-1))))] : PLANCHER_DB;
  return {fond:pc(0.10), parole:pc(0.95)};
}

function detecterPauses(env, seuilDb, dureeMin){
  const pas=env.pasMs/1000;
  const minT=Math.max(1,Math.round(dureeMin/pas));
  const out=[]; let deb=-1;
  for(let i=0;i<env.db.length;i++){
    const bas = env.db[i] < seuilDb;
    if(bas && deb<0) deb=i;
    if(!bas && deb>=0){ if(i-deb>=minT) out.push({debut:deb*pas, fin:i*pas}); deb=-1; }
  }
  if(deb>=0 && env.db.length-deb>=minT) out.push({debut:deb*pas, fin:env.db.length*pas});
  return out;
}

/* Enveloppe de démonstration, pour que l'application soit utilisable sans fichier. */
const MOTIF = [["s",1.20],["v",5.40],["s",0.52],["v",6.10],["s",0.66],["v",4.90],
               ["s",0.24],["v",5.80],["s",0.58],["v",4.20],["s",0.46],["v",5.10],["s",0.35]];
function enveloppeDemo(decalePhase){
  const pas=0.02, db=[];
  let j = decalePhase?7:0;
  for(const [k,d] of MOTIF){
    const n=Math.round(d/pas);
    for(let i=0;i<n;i++,j++) db.push(k==="v" ? -14+Math.sin(j*1.7)*3 : -64);
  }
  return {pasMs:20, db:Float32Array.from(db), duree:db.length*pas};
}

function parole(pauses,duree){
  const seg=[]; let t=0;
  for(const p of pauses){ if(p.debut>t) seg.push({debut:t,fin:p.debut}); t=Math.max(t,p.fin); }
  if(t<duree) seg.push({debut:t,fin:duree});
  const cum=[]; let c=0;
  for(const g of seg){ cum.push(c); c+=g.fin-g.debut; }
  return {seg,cum,total:c};
}
function versReel(P,tp){
  if(!P.seg.length) return tp;
  if(tp<=0) return P.seg[0].debut;
  if(tp>=P.total) return P.seg[P.seg.length-1].fin;
  let k=0; for(let i=0;i<P.seg.length;i++) if(P.cum[i]<=tp) k=i;
  return P.seg[k].debut + (tp-P.cum[k]);
}
/* L'écart d'une estimation à une respiration : nul si elle tombe dedans.
   C'est la même mesure dans la recherche et dans le compte rendu — sinon
   le compte rendu annonce un écart qu'aucun réglage ne cherche à réduire. */
function ecartAPause(t,p){ return t<p.debut ? p.debut-t : (t>p.fin ? t-p.fin : 0); }

function pauseProche(pauses,t,fen){
  let best=null,ec=fen;
  for(const p of pauses){
    const d = t<p.debut ? p.debut-t : (t>p.fin ? t-p.fin : 0);
    if(d<=ec){ ec=d; best=p; }
  }
  return best;
}

/* La cinquantaine de combinaisons : 7 durées minimales × 7 sensibilités.
   Aucune n'est exposée à l'utilisateur (section 5). */
const DUREES = [.12,.16,.20,.25,.32,.40,.50];
const SENSIB = [3,5,7,9,12,15,18];

function caler(texteSource, env){
  const paras = texteSource.replace(/\r\n/g,"\n").split(/\n\s*\n+/)
    .map(p=>p.replace(/\s+/g," ").trim()).filter(Boolean);
  if(!paras.length || !env) return null;
  const syl = paras.map(p=>Math.max(1,syllabes(p)));
  const tot = syl.reduce((a,b)=>a+b,0);
  const rep = reperes(env);

  let best=null, essais=0;
  for(const dm of DUREES){
    for(const k of SENSIB){
      essais++;
      const seuil = Math.min(rep.fond+k, rep.parole-3);
      const pauses = detecterPauses(env, seuil, dm);
      const P = parole(pauses, env.duree);
      if(P.total < env.duree*0.25 || P.total<=0) continue;
      const fr=[]; let cum=0;
      for(let i=0;i<paras.length-1;i++){ cum+=syl[i]; fr.push(versReel(P,cum/tot*P.total)); }
      let touche=0, somme=0;
      for(const t of fr){
        const p=pauseProche(pauses,t,.45);
        if(p){ touche++; somme+=ecartAPause(t,p); } else somme+=.45;
      }
      const cand={pauses,P,fr,touche,ecart:fr.length?somme/fr.length:0,dm,seuil};
      if(!best || cand.touche>best.touche || (cand.touche===best.touche && cand.ecart<best.ecart)) best=cand;
    }
  }
  if(!best){ const P=parole([],env.duree); best={pauses:[],P,fr:[],touche:0,ecart:.45}; }

  const debutVoix = best.P.seg.length ? best.P.seg[0].debut : 0;
  const finVoix   = best.P.seg.length ? best.P.seg[best.P.seg.length-1].fin : env.duree;

  const deb=[debutVoix], fin=[], cal=[true];
  let surPause=0, somme=0;
  for(const t of best.fr){
    const p = pauseProche(best.pauses,t,.45);
    if(p){ fin.push(p.debut); deb.push(p.fin); cal.push(true); surPause++; somme+=ecartAPause(t,p); }
    else { fin.push(t); deb.push(t); cal.push(false); somme+=.45; }
  }
  fin.push(finVoix);
  for(let i=0;i<paras.length;i++){
    if(i>0 && deb[i]<fin[i-1]) deb[i]=fin[i-1];
    if(fin[i]<deb[i]+.15) fin[i]=deb[i]+.15;
    if(i+1<paras.length && deb[i+1]<fin[i]) deb[i+1]=fin[i];
  }

  const paragraphes = paras.map((texte,i)=>({id:"p"+i+"_"+Date.now().toString(36),
    debut:deb[i], fin:fin[i], texte, cale:cal[i]}));
  const total=best.fr.length, estimees=total-surPause;
  return {
    paragraphes, pauses:best.pauses, essais,
    compteRendu:{ total, surPause, estimees, ecart: total?somme/total:0,
      phrase: redigerCR(total,surPause,estimees, total?somme/total:0) }
  };
}

function redigerCR(total,surPause,estimees,ecart){
  if(!total) return "Un seul passage, calé sur toute la voix.";
  let p = surPause+" passage"+(surPause>1?"s":"")+" sur "+total+" "+(surPause>1?"sont tombés":"est tombé")+" sur une vraie respiration";
  if(estimees>0) p += ", "+estimees+" "+(estimees>1?"restent estimés":"reste estimé")+", à vérifier";
  p += ". Écart moyen "+ecart.toFixed(2)+" s.";
  if(!estimees) p += " Rien à revérifier en priorité.";
  return p;
}

/* Lignes d'affichage d'un paragraphe, minutées dans ses bornes, silences respectés. */
function lignesDuParagraphe(para, pauses, style, dureeVoix){
  const L = decouperLignes(para.texte, style.taillePct, 1080);
  if(!L.length) return [];
  if(L.length===1) return [{debut:para.debut,fin:para.fin,texte:L[0]}];

  const glob = parole(pauses, dureeVoix||para.fin);
  const sousP = {seg:[],cum:[],total:0};
  for(const g of glob.seg){
    const d=Math.max(g.debut,para.debut), f=Math.min(g.fin,para.fin);
    if(f>d) sousP.seg.push({debut:d,fin:f});
  }
  if(!sousP.seg.length) sousP.seg.push({debut:para.debut,fin:para.fin});
  let c=0; for(const g of sousP.seg){ sousP.cum.push(c); c+=g.fin-g.debut; } sousP.total=c;

  const syl = L.map(l=>Math.max(1,syllabes(l))), tot = syl.reduce((a,b)=>a+b,0);
  const bornes=[para.debut]; let cum=0;
  for(let i=0;i<L.length-1;i++){
    cum+=syl[i];
    let t = versReel(sousP, cum/tot*sousP.total);
    const p = pauseProche(pauses,t,.32); if(p) t=p.debut;
    bornes.push(t);
  }
  bornes.push(para.fin);
  for(let i=1;i<bornes.length;i++) if(bornes[i]<bornes[i-1]) bornes[i]=bornes[i-1];

  const longues = pauses.filter(p=>p.fin-p.debut>.28);
  return L.map((texte,i)=>{
    let d=bornes[i], f=bornes[i+1];
    for(const p of longues){
      if(d>p.debut && d<p.fin) d=p.fin;
      if(f>p.debut && f<p.fin) f=p.debut;
      if(p.debut>=d && p.fin<=f) f=p.debut;
    }
    f=Math.max(f,d);
    if(f-d<.08){ let pl=d+.08; for(const p of longues) if(p.debut>=d&&p.debut<pl) pl=p.debut; f=Math.max(f,pl); }
    return {debut:d,fin:f,texte};
  });
}

function regenerer(){
  const voix = E.projet.audios.find(a=>a.id===E.projet.voixOffId);
  const dv = voix ? voix.env.duree : 0;
  const dec = voix ? voix.decalage : 0;
  const st=[];

      st.push({id:"s"+Math.random().toString(36).slice(2),
        debut:l.debut+dec, fin:l.fin+dec, texte:l.texte, paragrapheId:p.id});
  }

}

/* ---------- 2 ter. Montage automatique ----------------------------------
   Séquençage par les silences structurants, sous-titres à 7 mots maximum
   coupés aux phrases, et assemblage des médias sur les séquences. */

const MOTS_MAX_ST = 7;      // plafond dur, demandé
const SILENCE_MIN_SEQ = 0.5; // en deçà, c'est une respiration, pas une transition

/* Un silence « structurant » sépare deux séquences ; une respiration interne
   non. On les distingue par leur durée relative aux autres pauses du même
   enregistrement, avec un plancher absolu : sur une récitation posée, toutes
   les pauses se ressemblent, et un seuil purement relatif en découperait
   des dizaines. */
function sequencerAudio(env){
  const rep = reperes(env);
  const seuil = Math.min(rep.fond+9, rep.parole-3);
  const toutes = detecterPauses(env, seuil, 0.15);
  const P = parole(toutes, env.duree);
  const debutVoix = P.seg.length ? P.seg[0].debut : 0;
  const finVoix   = P.seg.length ? P.seg[P.seg.length-1].fin : env.duree;

  // Seules comptent les pauses situées entre le premier et le dernier mot :
  // le blanc initial et le blanc final ne sont pas des transitions.
  const internes = toutes.filter(p=>p.debut>debutVoix+0.05 && p.fin<finVoix-0.05);
  /* Distinguer respiration et transition. Un seuil relatif à la médiane
     échoue dès que TOUS les silences sont structurants : deux pauses de 0,9 s
     donnent une médiane de 0,9 et un seuil qui les rejette toutes les deux.
     On cherche donc une vraie rupture dans la distribution des durées : s'il
     existe un écart net entre les courtes et les longues, il sépare les deux
     familles ; sinon, elles sont toutes de même nature et seul le plancher
     absolu s'applique. */
  let seuilStruct = SILENCE_MIN_SEQ;
  if(internes.length>=2){
    const durees = internes.map(p=>p.fin-p.debut).sort((a,b)=>a-b);
    let meilleur=1, coupure=-1;
    for(let i=0;i<durees.length-1;i++){
      const r = durees[i+1]/Math.max(durees[i],1e-6);
      if(r>meilleur){ meilleur=r; coupure=i; }
    }
    if(meilleur>=1.6) seuilStruct = Math.max(SILENCE_MIN_SEQ, durees[coupure+1]);
  }
  const silences = internes.filter(p=>p.fin-p.debut>=seuilStruct);

  const sequences=[]; let t=debutVoix;
  for(const sil of silences){ sequences.push({debut:t, fin:sil.debut}); t=sil.fin; }
  sequences.push({debut:t, fin:finVoix});

  return {sequences, silences, pauses:toutes, debutVoix, finVoix, seuilStruct};
}

/* Découpe en phrases sans lookbehind (non supporté par les Safari anciens). */
function phrases(texte){
  const t = texte.replace(/\s+/g," ").trim();
  if(!t) return [];
  const out=[]; let cur="";
  for(const m of t.split(" ")){
    cur = cur ? cur+" "+m : m;
    if(/[.!?…]["»'’)\]]*$/.test(m)){ out.push(cur); cur=""; }
  }
  if(cur) out.push(cur);
  return out;
}

/* Un sous-titre ne franchit jamais une fin de phrase : on découpe phrase par
   phrase, puis à l'intérieur avec le même choix optimal de coupure que le
   reste de l'application, sous plafond de 7 mots. */
function sousTitresDuTexte(texte, taillePct, largeurImage){
  const out=[];
  for(const ph of phrases(texte)){
    for(const l of decouperLignes(ph, taillePct, largeurImage, MOTS_MAX_ST)) out.push(l);
  }
  return out;
}

/* Répartition syllabique sur le temps de parole, puis respect strict des
   silences : aucun sous-titre ne doit rester affiché pendant un blanc. */
function calerSousTitresAuto(textes, pauses, dureeVoix, decalage){
  if(!textes.length) return [];
  const P = parole(pauses, dureeVoix);
  const syl = textes.map(t=>Math.max(1,syllabes(t)));
  const tot = syl.reduce((a,b)=>a+b,0);

  const bornes=[P.seg.length?P.seg[0].debut:0];
  let cum=0;
  for(let i=0;i<textes.length;i++){ cum+=syl[i]; bornes.push(versReel(P, cum/tot*P.total)); }

  const longues = pauses.filter(p=>p.fin-p.debut>0.28);
  const out=[];
  for(let i=0;i<textes.length;i++){
    let d=bornes[i], f=bornes[i+1];
    const pr=pauseProche(pauses,f,0.32); if(pr && pr.debut>=d) f=pr.debut;
    for(const q of longues){
      if(d>q.debut && d<q.fin) d=q.fin;
      if(f>q.debut && f<q.fin) f=q.debut;
      if(q.debut>=d && q.fin<=f) f=q.debut;
    }
    f=Math.max(f,d);
    if(f-d<0.08){ // ne jamais rallonger à l'intérieur d'un silence
      let plafond=d+0.08;
      for(const q of longues) if(q.debut>=d && q.debut<plafond) plafond=q.debut;
      f=Math.max(f,plafond);
    }
    out.push({debut:d+decalage, fin:f+decalage, texte:textes[i]});
  }
  for(let i=1;i<out.length;i++) if(out[i].debut<out[i-1].fin) out[i].debut=out[i-1].fin;
  return out;
}

function choisirFichier(accept, multiple, cb){
  try{
    const inp=document.createElement("input");

    inp.style.display="none";
    inp.addEventListener("change",()=>{

      inp.remove();
      if(fs.length) cb(multiple?fs:fs[0]);
    });
    document.body.appendChild(inp); inp.click();
  }catch(e){ toast("Sélecteur de fichiers indisponible."); }
}

/* Rejette si la promesse n'aboutit pas à temps : sans cela, la moindre
   opération qui ne se résout jamais fige l'écran de progression pour de bon. */
function avecDelai(promesse, ms, message){
  let t;
  return Promise.race([
    Promise.resolve(promesse).finally(()=>clearTimeout(t)),
    new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error(message)), ms); }),
  ]);
}

/* Décode un fichier vers une enveloppe, sans jamais dépendre d'un geste
   utilisateur. Un AudioContext naît « suspendu » sur iOS et son resume() ne
   se résout qu'avec un geste actif — après le sélecteur de fichiers, ce geste
   a expiré, et l'attente ne se terminait jamais. Un OfflineAudioContext
   décode sans rien démarrer, donc sans ce piège. */
async function analyserAudio(file, surEtape){
  if(surEtape) surEtape("Lecture du fichier");
  const brut = await avecDelai(file.arrayBuffer(), 60000, "lecture trop longue");

  if(surEtape) surEtape("Décodage de la piste audio");
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const AC  = window.AudioContext || window.webkitAudioContext;
  let decodeur;
  if(OAC){ decodeur = new OAC(1, 1, 44100); }
  else { decodeur = ctxAudio = ctxAudio || new AC(); } // repli, sans resume()

  const buf = await avecDelai(new Promise((res,rej)=>{
    let fini=false;
    const ok=b=>{ if(!fini && b){ fini=true; res(b); } };
    const ko=e=>{ if(!fini){ fini=true; rej(e || new Error("format non décodable")); } };
    let p;
    try{ p = decodeur.decodeAudioData(brut.slice(0), ok, ko); }
    catch(e){ return ko(e); }
    if(p && p.then) p.then(ok, ko); // Safari récent renvoie aussi une promesse
  }), 90000, "décodage trop long");

  if(surEtape) surEtape("Repérage des silences");
  const n=buf.length, ch=buf.numberOfChannels;
  const pcm=new Float32Array(n);
  for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) pcm[i]+=d[i]/ch; }
  return { env: enveloppeDepuisPCM(pcm, buf.sampleRate, 20), duree: buf.duration };
}

/* Échelle de la bande de montage, en pixels par seconde. Continue : le
   pincement la fait varier d'un mouvement fluide, sans paliers. Les trois
   boutons sont des raccourcis exprimés en pourcentage du montage entier :
   100 % montre tout (l'ancien « Large »), 50 % en montre la moitié (donc une
   échelle deux fois plus resserrée), 25 % le quart (quatre fois). Ce sont des
   raccourcis, pas des bornes — pincer au-delà continue simplement. */
const ECH_MAX = 200;
const POURCENTAGES = {100:1, 50:2, 25:4};

function echelleMinimale(){
  const dispo=(E.largeurBande||330)-4;
  return Math.max(1.2, dispo/Math.max(dureeTotale(),1));
}
function echelle(){
  if(E.echellePxS==null) E.echellePxS = echelleMinimale()*POURCENTAGES[50]; // départ à 50 %
  return Math.max(echelleMinimale(), Math.min(ECH_MAX, E.echellePxS));
}
function clampEchelle(v){ return Math.max(echelleMinimale(), Math.min(ECH_MAX, v)); }

/* Pas de calage : plus fin quand on est zoomé de près, plus large en vue
   d'ensemble. Cinq paliers repères choisis en échelle logarithmique, pour que
   le pas suive le zoom sans jamais donner l'impression de sauter. */
function pasContinu(px){
  const paliers=[0.5,0.25,0.1,0.05,0.02], refs=[7,14,22,44,76];
  let meilleur=paliers[0], ecartMin=Infinity;
  for(let i=0;i<paliers.length;i++){
    const ecart=Math.abs(Math.log(refs[i])-Math.log(Math.max(1,px)));
    if(ecart<ecartMin){ ecartMin=ecart; meilleur=paliers[i]; }
  }
  return meilleur;
}

/* Graduations « rondes » : vise un écart lisible à l'écran (environ 70 px)
   entre deux graduations, quelle que soit l'échelle — comme sur une carte. */
function graduationNette(px){
  const cible=70/px;
  const paliers=[0.5,1,2,5,10,15,30,60,120,300,600,900,1800,3600];
  let meilleur=paliers[0], ecartMin=Infinity;
  for(const v of paliers){
    const ecart=Math.abs(Math.log(v)-Math.log(cible));
    if(ecart<ecartMin){ ecartMin=ecart; meilleur=v; }
  }
  return meilleur;
}

/* Taille du cadre en plein écran : celle des deux dimensions du téléphone qui
   laisse le 9:16 entier visible, jamais débordant. */
function tailleFullscreen(){
  const boite=document.getElementById("tel");
  if(!boite) return 300;
  const r=boite.getBoundingClientRect();
  if(!r.width || !r.height) return 300;
  return Math.max(120, Math.min(r.height, r.width*16/9));
}

/* Le balayage repeint ces nœuds au lieu de reconstruire le HTML : c'est ce qui
   fait la différence entre un aperçu qui suit le doigt et un aperçu qui saccade. */
function apercu(t, opt){
  opt=opt||{};
  const p = planA(t);
  const sObj = stA(t);
  const s = opt.st!==undefined ? opt.st : (sObj?sObj.texte:null);
  const st = E.projet.style;
  const plein = !!(opt.fullscreen && E.pleinEcran);
  const hauteur = plein ? tailleFullscreen() : (opt.h||300);
  const za = E.zoomAp || {scale:1};

  const bouton = opt.fullscreen
    ? `<button id="boutonPlein" class="btnPlein" data-act="pleinEcran"
        aria-label="${plein?"Quitter le plein écran":"Plein écran"}"
        title="${plein?"Quitter le plein écran":"Plein écran"}">${plein?"✕":"⛶"}</button>`
    : "";
  const transportPlein = plein ? `
    <div class="transportPlein">
      <button data-act="debut" aria-label="Revenir au début" title="Revenir au début">${icone("debut")}</button>
      <button class="jouer" data-act="lire" aria-label="${enLecture()?"Pause":"Lire"}"
        title="${enLecture()?"Pause":"Lire"}">${icone(enLecture()?"pause":"jouer")}</button>
      <button data-act="fin" aria-label="Aller à la fin" title="Aller à la fin">${icone("fin")}</button>
    </div>
    <div class="tps num transportPlein" id="tLectPlein">${tpsD(tL())} / ${tpsD(dureeTotale())}</div>` : "";

  return `<div class="cadre${plein?" pleinEcranActif":""}" style="height:${hauteur}px">
    <div class="neuf16" id="apCadre" style="height:100%">
      <div class="apZoom" id="apZoom" style="transform:scale(${za.scale})">
        <div class="media" id="apMedia" style="transform:scale(${zoomDe(p,opt.zoom).toFixed(4)})"></div>
        <div class="plan" id="apPlan" style="transform:scale(${zoomDe(p,opt.zoom).toFixed(4)});transform-origin:50% 45%">${p?("Plan "+(p.i+1)):"—"}</div>
        <div class="st ${st.police}" id="apSt" style="left:${st.x}%;top:${st.y}%;color:${st.couleur};font-size:${st.taillePct}%;${s?"":"display:none"}">${esc(s||"")}</div>
      </div>
      <div class="horloge num" id="apHorloge" style="${opt.horloge?"":"display:none"}">${tpsD(t)}</div>
      ${opt.badge?`<div class="badge">${esc(opt.badge)}</div>`:""}
      ${bouton}${transportPlein}
    </div></div>`;
}
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* Icônes de transport en SVG plutôt qu'en emoji : sur iPhone, les glyphes
   ⏮⏸▶⏭ s'affichent en couleur quelle que soit la couleur de texte demandée,
   ce qui jure avec une interface plate et sobre. Le SVG hérite de la couleur
   du bouton via currentColor, en accord avec la direction visuelle. */
function icone(nom){
  const a='width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"';
  if(nom==="debut") return `<svg ${a}><rect x="3" y="3" width="2.4" height="14"/><path d="M17 3.3 L7.2 10 L17 16.7 Z"/></svg>`;
  if(nom==="fin")   return `<svg ${a}><rect x="14.6" y="3" width="2.4" height="14"/><path d="M3 3.3 L12.8 10 L3 16.7 Z"/></svg>`;
  if(nom==="jouer") return `<svg ${a}><path d="M5 3 L16.5 10 L5 17 Z"/></svg>`;
  if(nom==="pause") return `<svg ${a}><rect x="5" y="3" width="3.6" height="14" rx="1"/><rect x="11.4" y="3" width="3.6" height="14" rx="1"/></svg>`;
  if(nom==="chevronG") return `<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 L6 10 L12 16"/></svg>`;
  if(nom==="chevronD") return `<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4 L14 10 L8 16"/></svg>`;
  return "";
}

/* Monte la vraie vidéo du plan courant si elle a été importée ; sinon le
   rectangle numéroté de la maquette. */
function monterMedia(t, avecZoom){
  const cadre=document.getElementById("apMedia"); if(!cadre) return null;
  const p=planA(t);
  const v=(p && MEDIA.videos[p.c.id]) || null;
  const img=(p && !v && MEDIA.images[p.c.id]) || null;
  const el = v || img;
  const actuel=cadre.firstElementChild;
  if(el!==actuel){ if(actuel) actuel.remove(); if(el) cadre.appendChild(el); }
  if(v && p){
    const local = p.c.debut + p.dans*(p.c.fin-p.c.debut);
    try{ if(!enLecture() || Math.abs(v.currentTime-local)>0.3) v.currentTime=local; }catch(e){}
    if(enLecture() && v.paused) { const j=v.play(); if(j&&j.catch) j.catch(()=>{}); }
    if(!enLecture() && !v.paused) v.pause();
  }
  for(const id in MEDIA.videos){ const o=MEDIA.videos[id]; if(o!==v && !o.paused) o.pause(); }
  cadre.style.transform="scale("+zoomDe(p,avecZoom).toFixed(4)+")";
  return el;
}

function peindreApercu(t, stForce, avecZoom){
  const p = planA(t);
  const v = monterMedia(t, avecZoom);
  const plan = document.getElementById("apPlan");
  if(plan){
    const txt = p?("Plan "+(p.i+1)):"—";
    if(plan.textContent!==txt) plan.textContent=txt;
    plan.style.transform = "scale("+zoomDe(p,avecZoom).toFixed(4)+")";
    plan.style.display = v ? "none" : "";
  }
  const el = document.getElementById("apSt");
  if(el){
    const sObj = stA(t);
    const s = stForce!==undefined ? stForce : (sObj?sObj.texte:null);
    if(s){ if(el.textContent!==s) el.textContent=s; el.style.display=""; }
    else el.style.display="none";
  }
  const h = document.getElementById("apHorloge");
  if(h){ h.textContent=tpsD(t); h.style.display=""; }
}

/* ---------- 5. Bande de montage (4.8) ------------------------------------ */

const tetePos = () => E.tete!==null ? E.tete : (E.lecture ? E.lecture.t : null);

function bande(){
  const P=E.projet, ech=echelle(), dur=dureeTotale();
  const W=Math.max(dur*ech, (E.largeurBande||330)-4);
  const pasG = graduationNette(ech);

  let regle="";
  for(let t=0;t<=dur;t+=pasG){
    regle += `<i style="left:${t*ech}px"></i><span style="left:${t*ech+3}px">${tps(t)}</span>`;
  }
  let clips="";
  P.clips.forEach((c,i)=>{
    const d=c.fin-c.debut, x=debutDe(i)*ech, w=Math.max(d*ech,26);
    const z = c.zoomAmplitude>0 ? `<div class="d">zoom ${c.zoomSens==="avant"?"↗":"↘"}</div>` : "";
    const court = w<64;
    const sel = E.blocSelectionne && E.blocSelectionne.type==="clip" && E.blocSelectionne.id===c.id;
    const poignees = sel ? `
      <div class="poignee g" data-poignee="debut" data-cible="clip" data-id="${c.id}" aria-label="Raccourcir ou allonger le début">${icone("chevronG")}</div>
      <div class="poignee d" data-poignee="fin" data-cible="clip" data-id="${c.id}" aria-label="Raccourcir ou allonger la fin">${icone("chevronD")}</div>` : "";
    clips += `<div class="bloc clip${sel?" selectionne":""}" data-type="clip" data-id="${c.id}" style="left:${x}px;width:${w-3}px"
      aria-label="Clip ${i+1}, ${d.toFixed(1)} secondes${sel?", sélectionné":""}">
      <div>${i+1}</div>${court?"":`<div class="d num">${d.toFixed(1)} s</div>${z}`}${poignees}</div>`;
  });
  let audios="";
  P.audios.forEach(a=>{
    const w=Math.max(a.duree*ech,40);
    const sel = E.blocSelectionne && E.blocSelectionne.type==="audio" && E.blocSelectionne.id===a.id;
    const ph = sel ? `
      <div class="poignee g" data-poignee="debut" data-cible="audio" data-id="${a.id}" aria-label="Raccourcir ou allonger le début">${icone("chevronG")}</div>
      <div class="poignee d" data-poignee="fin" data-cible="audio" data-id="${a.id}" aria-label="Raccourcir ou allonger la fin">${icone("chevronD")}</div>` : "";
    audios += `<div class="rang"><div class="bloc audio${sel?" selectionne":""}" data-type="audio" data-id="${a.id}"
      style="left:${a.decalage*ech}px;width:${w-3}px" aria-label="Bande son ${esc(a.nom)}${sel?", sélectionnée":""}">
      <div>${esc(a.nom)}</div>${w<80?"":`<div class="d num">${a.duree.toFixed(1)} s</div>`}${ph}</div></div>`;
  });
  let sst="";
  P.sousTitres.forEach(s=>{
    const para = P.paragraphes.find(p=>p.id===s.paragrapheId);
    const v = para && !para.cale ? " verif" : "";
    const w = Math.max((s.fin-s.debut)*ech,14);
    const sel = E.blocSelectionne && E.blocSelectionne.type==="st" && E.blocSelectionne.id===s.id;
    sst += `<div class="bloc sst${v}${sel?" selectionne":""}" data-type="st" data-id="${s.id}"
      style="left:${s.debut*ech}px;width:${w-3}px" aria-label="Sous-titre ${esc(s.texte.slice(0,30))}"
      >${w>34?esc(s.texte.slice(0,22)):""}</div>`;
  });

  const tt = tetePos();
  const enT = E.tete!==null ? `Lâchez à ${tpsD(E.tete)}` : (E.lecture ? tpsD(E.lecture.t) : tps(dur));
  const pas = pasContinu(ech);
  const pasTxt = pas<1 ? Math.round(pas*1000)+" ms" : "0,5 s";
  const min = echelleMinimale();
  const vueEnsemble = ech<=min+0.05;

  // Un bouton n'a l'air « actif » que si le pincement n'a pas déjà éloigné
  // l'échelle de ce préréglage : au-delà d'un petit écart, aucun des trois
  // n'est plus vraiment vrai, et forcer un affichage serait mentir.
  const pres = n => {
    const cible = min * POURCENTAGES[n];
    return Math.abs(ech-cible)/cible < 0.04;
  };

  return `
  <div class="bandeCadre">
    <div class="bandeEnt"><span class="t">Bande de montage</span><span class="v num" id="bandeT">${enT}</span></div>
    <div class="defil" id="defil"><div class="piste" style="width:${W}px" id="piste">
      <div class="regle">${regle}</div>
      <div class="rang">${clips}</div>
      ${audios}
      <div class="rang st">${sst}</div>
      <div class="tete" id="tete" style="left:0;transform:translateX(${(tt||0)*ech}px);${tt===null?"display:none":""}"></div>
    </div></div>
    <div class="prec">
      ${[100,50,25].map(n=>`<button data-prec="${n}" aria-pressed="${pres(n)}">${n} %</button>`).join("")}
    </div>
    <div class="pas num">Calage au ${pasTxt} près${vueEnsemble?" · tout le montage à l'écran":""}</div>
  </div>`;
}

function majTete(t){
  const tete=document.getElementById("tete");
  if(tete){ tete.style.display=""; tete.style.transform="translateX("+(t*echelle())+"px)"; }
  const ent=document.getElementById("bandeT");
  if(ent) ent.textContent=(E.tete!==null?"Lâchez à ":"")+tpsD(t);
}

/* Repeint la bande à l'échelle courante SANS reconstruire son HTML : c'est ce
   qui rend le pincement fluide plutôt que saccadé. Un rendu complet (rendre())
   détruit et recrée toute la piste à chaque frame — imperceptible pour un clic,
   mais un pincement en déclenche des dizaines par seconde. Ici, on ne touche
   qu'à ce qui a changé : la largeur des blocs et leur position. */
function redessinerBandeContinu(){
  const piste=document.getElementById("piste"); if(!piste) return;
  const P=E.projet, ech=echelle(), dur=dureeTotale();
  piste.style.width = Math.max(dur*ech, (E.largeurBande||330)-4)+"px";

  P.clips.forEach((c,i)=>{
    const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]'); if(!el) return;
    el.style.left=(debutDe(i)*ech)+"px";
    el.style.width=(Math.max((c.fin-c.debut)*ech,26)-3)+"px";
  });
  P.audios.forEach(a=>{
    const el=piste.querySelector('.bloc.audio[data-id="'+a.id+'"]'); if(!el) return;
    el.style.left=(a.decalage*ech)+"px";
    el.style.width=(Math.max(a.duree*ech,40)-3)+"px";
  });
  P.sousTitres.forEach(s=>{
    const el=piste.querySelector('.bloc.sst[data-id="'+s.id+'"]'); if(!el) return;
    el.style.left=(s.debut*ech)+"px";
    el.style.width=(Math.max((s.fin-s.debut)*ech,14)-3)+"px";
  });

  const regle=piste.querySelector(".regle");
  if(regle){
    const pasG=graduationNette(ech); let html="";
    for(let t=0;t<=dur;t+=pasG) html += `<i style="left:${t*ech}px"></i><span style="left:${t*ech+3}px">${tps(t)}</span>`;
    regle.innerHTML=html;
  }

  majTete(tetePos()||0);

  const pas=pasContinu(ech);
  const pasTxt = pas<1 ? Math.round(pas*1000)+" ms" : "0,5 s";
  const min=echelleMinimale();
  const pasEl=document.querySelector(".pas");
  if(pasEl) pasEl.textContent = "Calage au "+pasTxt+" près"+(ech<=min+0.05?" · tout le montage à l'écran":"");

  document.querySelectorAll("[data-prec]").forEach(btn=>{
    const cible = min * POURCENTAGES[btn.dataset.prec];
    btn.setAttribute("aria-pressed", Math.abs(ech-cible)/cible<0.04 ? "true":"false");
  });
}

const SEUIL_GLISSE = 5;   // px : en deçà, c'est un appui
const MARGE_AUTO   = 42;  // px : zone de défilement automatique au bord

/* Un seul doigt fait glisser un bloc ; deux doigts pincent la bande. Les deux
   gestes utilisent les mêmes événements de pointeur, donc sans coordination
   explicite le second doigt posé sur un bloc démarre AUSSI un glissement — et
   c'est exactement ce qui décalait les vidéos et les pistes pendant un pincement.
   Geste.actifs suit chaque doigt ; dès qu'un deuxième arrive, le glissement en
   cours est annulé et rien ne peut en redémarrer un tant que les deux doigts
   ne sont pas complètement relevés. */
const Geste = { actifs:new Map(), pince:false, dist0:0, glissementCourant:null, raf:null };

function annulerGlissementEnCours(){
  if(Geste.glissementCourant){ Geste.glissementCourant(); Geste.glissementCourant=null; }
}

/* Un seul repeint par image, quel que soit le nombre d'événements de
   pincement reçus entre deux frames : c'est ce qui garde le geste fluide
   même sur un projet chargé. */
function planifierRedessinContinu(){
  if(Geste.raf==null) Geste.raf=requestAnimationFrame(()=>{ Geste.raf=null; redessinerBandeContinu(); });
}

function brancherGlisse(){
  const piste=document.getElementById("piste"); if(!piste) return;
  const defil=document.getElementById("defil");
  E.largeurBande = defil.clientWidth || E.largeurBande || 330;
  Geste.glissementCourant=null; // un ancien glissement ne doit pas survivre à un nouveau rendu
  // Geste.actifs / Geste.pince : volontairement pas réinitialisés ici. Un
  // changement de niveau de précision redessine la bande EN PLEIN PINCEMENT ;
  // les deux doigts doivent rester suivis pendant toute la durée du geste.

  const distance = ()=>{
    const pts=[...Geste.actifs.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  };

  /* Capturée sur la bande entière, donc vue avant le gestionnaire posé sur
     chaque bloc : c'est ce qui permet d'intercepter le deuxième doigt avant
     qu'il ne déclenche son propre glissement. */
  defil.addEventListener("pointerdown",e=>{
    Geste.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Geste.actifs.size===2){
      Geste.pince=true;
      annulerGlissementEnCours();
      Geste.dist0=distance();
    }
  },{capture:true});

  defil.addEventListener("pointermove",e=>{
    if(!Geste.actifs.has(e.pointerId)) return;
    Geste.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Geste.pince && Geste.actifs.size>=2){
      const d=distance();
      if(Geste.dist0>0){
        E.echellePxS = clampEchelle(echelle() * (d/Geste.dist0));
        planifierRedessinContinu();
      }
      Geste.dist0=d;
      e.stopPropagation();
    }
  },{capture:true});

  const relacherPointeur=e=>{
    Geste.actifs.delete(e.pointerId);
    if(Geste.actifs.size===0) Geste.pince=false;
  };
  defil.addEventListener("pointerup",relacherPointeur,{capture:true});
  defil.addEventListener("pointercancel",relacherPointeur,{capture:true});

  piste.querySelectorAll(".bloc").forEach(b=>{
    const type=b.dataset.type, id=b.dataset.id;
    b.setAttribute("role","button"); b.setAttribute("tabindex","0");
    b.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); b.click(); } });

    const selectionne = E.blocSelectionne && E.blocSelectionne.type===type && E.blocSelectionne.id===id;

    if(!selectionne){
      /* Pas encore sélectionné : le toucher ne doit RIEN intercepter — c'est
         ce qui permet de faire défiler la page en balayant par-dessus une
         vidéo ou un son sans le décaler par erreur. Un simple appui (le seul
         geste qui produit un « click » natif sans avoir bougé) le sélectionne ;
         touch-action:pan-x pan-y laisse le reste au défilement natif. */
      b.addEventListener("click",()=>{
        if(Geste.pince) return;
        E.blocSelectionne={type,id};
        rendre();
      });
      return;
    }

    /* Sélectionné : redevient une cible de glissement exclusive, exactement
       comme avant. Un appui SANS glissement sur un bloc déjà sélectionné
       ouvre son écran de détail (clip, sous-titre) ou referme la sélection
       (bande son, qui n'a pas d'écran dédié depuis la bande). */
    let vuPointeur=false;
    b.addEventListener("click",()=>{
      if(vuPointeur) return;
      if(type==="clip") aller("clip",{clipId:id});
      else if(type==="st") aller("editST",{stId:id});
      else { E.blocSelectionne=null; rendre(); }
    });

    b.addEventListener("pointerdown",dep=>{
      if(Geste.pince || Geste.actifs.size>=2) return; // un pincement est en cours : pas de glissement
      if(dep.target.closest(".poignee")) return; // laissé au gestionnaire des poignées
      dep.preventDefault();
      vuPointeur=true; setTimeout(()=>{vuPointeur=false;},350);

      const ech = echelle();
      const gauche0 = parseFloat(b.style.left)||0;
      const x0 = dep.clientX, scroll0 = defil.scrollLeft;
      let bouge=false, raf=null, xCourant=x0, annule=false;

      const obj = type==="audio" ? E.projet.audios.find(a=>a.id===id)
                : type==="st"    ? E.projet.sousTitres.find(s=>s.id===id) : null;
      if(type!=="clip" && !obj) return;
      const base = type==="audio" ? obj.decalage : type==="st" ? obj.debut : 0;

      let ordre = type==="clip" ? E.projet.clips.slice() : null;
      let iCourant = ordre ? ordre.findIndex(c=>c.id===id) : -1;
      const larg = c => Math.max((c.fin-c.debut)*ech, 26);
      const gaucheDe = (tab,k) => tab.slice(0,k).reduce((s,c)=>s+larg(c),0);

      try{ b.setPointerCapture(dep.pointerId); }catch(e){}

      /* Si un deuxième doigt se pose pendant ce glissement, Geste appelle ceci
         immédiatement : on efface tout effet visuel déjà produit (position du
         bloc, réordonnancement éventuel des clips voisins) et on rend la main
         au pincement. Le drapeau « annule » ferme la porte même si un
         événement de pointeur en cours de route arrivait malgré tout. */
      Geste.glissementCourant = ()=>{
        annule=true;
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        b.removeEventListener("pointermove",bouger);
        b.removeEventListener("pointerup",finir);
        b.removeEventListener("pointercancel",finir);
        try{ b.releasePointerCapture(dep.pointerId); }catch(e){}
        b.classList.remove("saisi"); b.style.transform="";
        if(type==="clip"){
          E.projet.clips.forEach((c,k)=>{
            const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]');
            if(el) el.style.left=gaucheDe(E.projet.clips,k)+"px";
          });
        }
        E.tete=null;
        const teteEl=document.getElementById("tete"); if(teteEl) teteEl.style.display="none";
        peindreApercu(tL());
      };

      const planifier = ()=>{ if(raf==null) raf=requestAnimationFrame(peindre); };

      /* Séparé de l'affichage : un geste rapide relâché avant la première frame
         doit tout de même aboutir au bon ordre. */
      function recalculerOrdre(){
        if(!ordre) return false;
        const r=piste.getBoundingClientRect();
        const px = xCourant - r.left + defil.scrollLeft;
        let acc=0, cible=ordre.length-1;
        for(let k=0;k<ordre.length;k++){
          const w=larg(ordre[k]);
          if(px < acc + w/2){ cible=k; break; }
          acc+=w;
        }
        if(cible===iCourant) return false;
        const [pris]=ordre.splice(iCourant,1);
        ordre.splice(cible,0,pris); iCourant=cible;
        return true;
      }

      function peindre(){
        raf=null;
        if(!bouge) return;
        const dx = xCourant - x0 + (defil.scrollLeft - scroll0);

        if(type==="clip"){
          if(recalculerOrdre()){
            ordre.forEach((c,k)=>{
              if(c.id===id) return;
              const el=piste.querySelector('.bloc.clip[data-id="'+c.id+'"]');
              if(el) el.style.left=gaucheDe(ordre,k)+"px";
            });
          }
          b.style.transform="translateX("+dx+"px)";
          E.tete=Math.max(0,(gauche0+dx)/ech);
        } else {
          const t=Math.max(0, base + dx/ech);
          b.style.transform="translateX("+((t-base)*ech)+"px)";
          E.tete=t;
        }
        majTete(E.tete);
        peindreApercu(E.tete, type==="st"?obj.texte:undefined);

        /* Défilement automatique quand le doigt approche du bord. */
        const rd=defil.getBoundingClientRect();
        let v=0;
        if(xCourant < rd.left+MARGE_AUTO) v=-9;
        else if(xCourant > rd.right-MARGE_AUTO) v=9;
        if(v){ defil.scrollLeft += v; planifier(); }
      }

      // Le seuil est franchi dans le gestionnaire lui-même : un geste rapide ne
      // doit pas être pris pour un appui parce que la frame n'est pas encore passée.
      const bouger = e2=>{
        if(annule) return;
        xCourant=e2.clientX;
        if(!bouge && Math.abs(xCourant-x0+(defil.scrollLeft-scroll0))>=SEUIL_GLISSE){
          bouge=true; b.classList.add("saisi");
        }
        planifier();
      };

      const finir = e2=>{
        if(annule) return;
        Geste.glissementCourant=null; // geste terminé normalement, plus rien à annuler
        b.removeEventListener("pointermove",bouger);
        b.removeEventListener("pointerup",finir);
        b.removeEventListener("pointercancel",finir);
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        if(typeof e2?.clientX==="number") xCourant=e2.clientX;
        const dx = xCourant - x0 + (defil.scrollLeft - scroll0);
        b.classList.remove("saisi"); b.style.transform=""; E.tete=null;

        if(!bouge){
          if(type==="clip") aller("clip",{clipId:id});
          else if(type==="st") aller("editST",{stId:id});
          else rendre();
          return;
        }
        if(type==="clip"){
          recalculerOrdre();
          if(ordre.map(c=>c.id).join(",")===E.projet.clips.map(c=>c.id).join(",")){ rendre(); return; }
          agir("Déplacement du clip", ()=>{ E.projet.clips = ordre; });
          return;
        }
        const pas=pasContinu(ech); // le pas de calage suit l'échelle continue, pas un palier nommé
        const t=Math.max(0, Math.round((base+dx/ech)/pas)*pas);
        const decal=t-base;
        if(Math.abs(decal)<1e-9){ rendre(); return; }
        agir(type==="audio"?"Déplacement de la bande son":"Recalage du sous-titre", ()=>{
          if(type==="audio"){
            obj.decalage=t;
            if(id===E.projet.voixOffId && E.projet.paragraphes.length){
              E.projet.paragraphes.forEach(p=>{p.debut+=decal;p.fin+=decal;});
              E.projet.sousTitres.forEach(s=>{ if(s.paragrapheId){s.debut+=decal;s.fin+=decal;} });
              E.toastEnAttente="Les sous-titres ont suivi la voix.";
            }
          } else { const d=obj.fin-obj.debut; obj.debut=t; obj.fin=t+d; }
        });
      };

      b.addEventListener("pointermove",bouger);
      b.addEventListener("pointerup",finir);
      b.addEventListener("pointercancel",finir);
    });
  });

  /* Poignées de raccourcissement / allongement, façon montage natif de
     l'iPhone. Sur un clip : le bord gauche reste ancré aux clips précédents
     (c'est ce qui les garde bout à bout), seule la largeur bouge. Sur une
     bande son : elle flotte librement dans le temps, donc raccourcir le début
     avance aussi son point d'entrée dans le fichier, en gardant sa fin fixe.
     Note : le §4.4 interdisait toute découpe audio ; changement demandé. */
  const DUREE_MIN_CLIP = 0.3;
  piste.querySelectorAll(".poignee").forEach(h=>{
    h.addEventListener("pointerdown",dep=>{
      if(Geste.pince || Geste.actifs.size>=2) return;
      dep.preventDefault(); dep.stopPropagation();
      const cote=h.dataset.poignee, cible=h.dataset.cible||"clip", id=h.dataset.id;
      const estAudio = cible==="audio";
      const o = estAudio ? E.projet.audios.find(x=>x.id===id) : E.projet.clips.find(x=>x.id===id);
      if(!o) return;
      const ech=echelle();
      const bloc=piste.querySelector('.bloc.'+(estAudio?"audio":"clip")+'[data-id="'+id+'"]');
      const dEl = bloc ? bloc.querySelector(".d") : null;

      // Instantané de l'état de départ : tout est calculé par rapport à lui.
      const S = estAudio
        ? {debut:o.debut||0, duree:o.duree, decalage:o.decalage, source:o.dureeSource ?? o.duree}
        : {debut:o.debut, fin:o.fin, finMax:o.finMax ?? o.fin};
      const x0=dep.clientX;
      let raf=null, dx=0, annule=false;

      try{ h.setPointerCapture(dep.pointerId); }catch(e){}

      Geste.glissementCourant = ()=>{
        annule=true;
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        h.removeEventListener("pointermove",bouger);
        h.removeEventListener("pointerup",finir);
        h.removeEventListener("pointercancel",finir);
        try{ h.releasePointerCapture(dep.pointerId); }catch(e){}
        redessinerBandeContinu();
      };

      function calculer(){
        const dt=dx/ech;
        if(estAudio){
          if(cote==="debut"){
            // On ne peut pas entrer avant le début du fichier, ni réduire
            // sous la durée minimale : la fin reste fixe dans le temps.
            const min=-S.debut, max=S.duree-DUREE_MIN_CLIP;
            const d=Math.max(min, Math.min(max, dt));
            return {debut:S.debut+d, duree:S.duree-d, decalage:S.decalage+d};
          }
          const max=S.source-S.debut, d=Math.max(DUREE_MIN_CLIP, Math.min(max, S.duree+dt));
          return {debut:S.debut, duree:d, decalage:S.decalage};
        }
        let debut=S.debut, fin=S.fin;
        if(cote==="debut") debut=Math.max(0, Math.min(S.fin-DUREE_MIN_CLIP, S.debut+dt));
        else fin=Math.max(S.debut+DUREE_MIN_CLIP, Math.min(S.finMax, S.fin+dt));
        return {debut,fin};
      }
      function peindre(){
        raf=null;
        const r=calculer();
        const duree = estAudio ? r.duree : (r.fin-r.debut);
        if(bloc){
          bloc.style.width=(Math.max(duree*ech, estAudio?40:26)-3)+"px";
          if(estAudio) bloc.style.left=(r.decalage*ech)+"px";
        }
        if(dEl) dEl.textContent=duree.toFixed(1)+" s";
      }
      function planifier(){ if(raf==null) raf=requestAnimationFrame(peindre); }
      const bouger=e2=>{ if(annule) return; dx=e2.clientX-x0; planifier(); };
      const finir=e2=>{
        if(annule) return;
        Geste.glissementCourant=null;
        h.removeEventListener("pointermove",bouger);
        h.removeEventListener("pointerup",finir);
        h.removeEventListener("pointercancel",finir);
        if(raf!=null){ cancelAnimationFrame(raf); raf=null; }
        if(typeof e2?.clientX==="number") dx=e2.clientX-x0;
        const r=calculer();
        const inchange = estAudio
          ? (Math.abs(r.duree-S.duree)<1e-6 && Math.abs(r.debut-S.debut)<1e-6)
          : (Math.abs(r.debut-S.debut)<1e-6 && Math.abs(r.fin-S.fin)<1e-6);
        if(inchange){ rendre(); return; }
        agir(cote==="debut"?"Ajustement du début":"Ajustement de la fin", ()=>{
          if(estAudio){ o.debut=r.debut; o.duree=r.duree; o.decalage=r.decalage; }
          else { o.debut=r.debut; o.fin=r.fin; }
        });
      };
      h.addEventListener("pointermove",bouger);
      h.addEventListener("pointerup",finir);
      h.addEventListener("pointercancel",finir);
    });
  });

  /* Toucher une zone vide de la bande (pas un bloc, pas une poignée) referme
     la sélection en cours. */
  piste.addEventListener("click",e=>{
    if(Geste.pince) return;
    if(!e.target.closest(".bloc") && !e.target.closest(".poignee") && E.blocSelectionne){
      E.blocSelectionne=null; rendre();
    }
  });

  /* Toucher ou balayer la règle déplace la lecture : sans cela, les deux
     boutons de bout en bout sont la seule navigation possible. */
  const regle=piste.querySelector(".regle");
  if(regle){
    const viser = e=>{
      const r=piste.getBoundingClientRect();
      const t=Math.max(0, Math.min(dureeTotale(), (e.clientX-r.left+defil.scrollLeft)/echelle()));
      arreterLecture(); E.lecture={t};
      peindreApercu(t); majTete(t);
      const l=document.getElementById("tLect");
      if(l) l.textContent=tpsD(t)+" / "+tpsD(dureeTotale());
    };
    regle.addEventListener("pointerdown",e=>{
      e.preventDefault();
      try{ regle.setPointerCapture(e.pointerId); }catch(err){}
      viser(e);
      const mv=e2=>viser(e2);
      const up=()=>{
        regle.removeEventListener("pointermove",mv);
        regle.removeEventListener("pointerup",up);
        regle.removeEventListener("pointercancel",up);
        rendre();
      };
      regle.addEventListener("pointermove",mv);
      regle.addEventListener("pointerup",up);
      regle.addEventListener("pointercancel",up);
    });
  }

  document.querySelectorAll("[data-prec]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const n=btn.dataset.prec;
      E.echellePxS = echelleMinimale() * POURCENTAGES[n];
      rendre();
    });
  });
}

  corps:`<div style="padding-top:120px"><div class="jauge"><i id="jauge"></i></div>
    <div class="legende" id="jaugeTxt">Analyse des respirations</div></div>`,
});

EC.verif = () => {

    barre:{g:`<button data-act="retour">Retour</button>`,titre:"Vérification"},

      ${cr?`<div class="legende" style="padding:12px 0 4px">${esc(cr.phrase)}</div>`:""}
      ${P.paragraphes.map((p,i)=>{
        const L=P.sousTitres.filter(s=>s.paragrapheId===p.id);

          <div class="h"><span class="tps">${tpsD(p.debut)}</span>
            <span style="flex:1;min-width:0">${esc(p.texte.slice(0,60))}${p.texte.length>60?"…":""}</span>
            ${!p.cale?`<span class="marque">À vérifier</span>`:""}</div>

      <button class="secondaire" style="margin-top:16px" data-act="redecouper">Découper les plans sur les paragraphes</button>

    pied: actif?`<div class="duo">
        <button class="secondaire" data-act="lecture">${E.lecture?"Pause":"Écouter"}</button>
        <button class="principal" data-act="commenceIci">Ce passage commence ici</button></div>`:
      `<div class="legende" style="text-align:center">Touchez un passage pour l'écouter.</div>`,

    <div class="micro">Ailleurs</div>

    barre:{g:`<button data-act="retour">Retour</button>`,titre:"Sous-titre"},

      <div class="micro">Début</div>

      <div class="micro">Fin</div>

const niveauTaille = () => E.projet.style.taillePct-3;

EC.exporter = () => {

        <div class="legende num">Export en cours… ${p} %</div>`:""}`,

/* ---------- 7. Rendu ----------------------------------------------------- */

function rendre(anim){
  const nom = E.pile[E.pile.length-1];
  const v = EC[nom]();
  const b = v.barre||{};
  document.getElementById("tel").innerHTML = `
    <div class="ecran ${anim?"entre":""}">
      <div class="barre"><div class="g">${b.g||""}</div><div class="titre">${b.titre||""}</div><div class="d">${b.d||""}</div></div>
      <div class="corps ${v.sansmarge?"sansmarge":""}">${v.corps||""}</div>
      ${v.pied?`<div class="pied">${v.pied}</div>`:""}
      ${E.toast?`<div class="toast">${esc(E.toast)}</div>`:""}
    </div>`;
  brancher();
  if(document.getElementById("apMedia")) monterMedia(E.lecture?E.lecture.t:0);
  if(nom==="montage"||nom==="verif") brancherGlisse();
  if(nom==="apparence") brancherPlacement();
  // Le pincement du montage lui-même n'existe qu'une fois le plein écran actif.
  if(E.pleinEcran && document.getElementById("boutonPlein")) brancherPinceApercu();
}

function brancher(){
  const tel=document.getElementById("tel");
  tel.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>{
    const [e,arg]=el.dataset.go.split(":");
    if(e==="editST") aller("editST",{stId:arg}); else aller(e);
  }));
  tel.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",()=>acte(el.dataset.act)));
  tel.querySelectorAll("[data-set]").forEach(el=>el.addEventListener("click",()=>{
    const [k,v]=el.dataset.set.split(":");
    if(k==="zS") E.ctx.zS=v;
    else agir("Changement d'apparence",()=>{ E.projet.style[k]=v; if(k==="police") regenerer(); });
    rendre();
  }));
  tel.querySelectorAll("[data-in]").forEach(el=>{
    const ev = el.tagName==="TEXTAREA" ? "input" : "input";
    el.addEventListener(ev,()=>saisie(el.dataset.in, el.value, el));
  });
  tel.querySelectorAll("[data-voix]").forEach(el=>el.addEventListener("change",()=>{E.ctx.voix=el.dataset.voix;}));
  tel.querySelectorAll("[data-para]").forEach(el=>el.addEventListener("click",()=>{
    E.ctx.paraActif=el.dataset.para; arreterLecture();
    const p=E.projet.paragraphes.find(x=>x.id===el.dataset.para);
    E.lecture={t:Math.max(0,p.debut-0.4)}; lancerLecture(); rendre();
  }));
}

function saisie(champ,val,el){
  const n=parseFloat(val);
  if(champ==="coupe"){ E.ctx.coupe=n; majTexteProche(el,tpsD(n)); return; }
  if(champ==="rA"||champ==="rB"){
    const c=E.projet.clips.find(x=>x.id===E.ctx.clipId), d=c.fin-c.debut, min=d*0.08;
    let a=E.ctx.rA??0, b=E.ctx.rB??d;
    if(champ==="rA"){ a=Math.min(n,b-min); } else { b=Math.max(n,a+min); }
    E.ctx.rA=Math.max(0,a); E.ctx.rB=Math.min(d,b); rendre(); return;
  }
  if(champ==="zA"){ E.ctx.zA=n; rendre(); return; }
  if(champ==="taille"){
    agir("Changement de taille",()=>{ E.projet.style.taillePct=n; regenerer(); }); return;
  }
  if(champ==="texte"){ E.ctx.texte=val; return; }
  if(champ==="autoTexte"){ E.auto=Object.assign(E.auto||{sequences:[],medias:[]},{texte:val}); return; }
  if(champ==="stTexte"){ const s=E.projet.sousTitres.find(x=>x.id===E.ctx.stId); if(s) s.texte=val; return; }
}
function majTexteProche(el,txt){ const d=el.parentElement.querySelector("div.num"); if(d) d.textContent=txt; }

/* ---------- 8. Actions --------------------------------------------------- */

function acte(a){
  const [nom,arg,arg2,arg3]=a.split(":");
  const P=E.projet;

  if(nom==="retour") return retour();
  if(nom==="stopCalage"){ clearInterval(E.calageT); E.calageT=null; E.pile.pop(); return rendre(); }
  if(nom==="annuler") return annuler();

  if(nom==="importer"){
    choisirFichier("video/*,.mp4,.mov,.m4v", true, async files=>{
      const ajouts=[];
      for(const f of files){
        try{
          const url=URL.createObjectURL(f);
          const v=document.createElement("video");
          v.src=url; v.preload="auto"; v.playsInline=true; v.muted=false;
          const duree = await new Promise((res,rej)=>{
            v.addEventListener("loadedmetadata",()=>res(v.duration),{once:true});
            v.addEventListener("error",()=>rej(new Error()),{once:true});
            setTimeout(()=>rej(new Error()),12000);
          });
          const id="c"+Date.now()+"_"+ajouts.length;
          MEDIA.videos[id]=v;
          ajouts.push({id,nom:f.name,debut:0,fin:duree,finMax:duree,zoomAmplitude:0,zoomSens:"avant"});
        }catch(e){ /* fichier illisible : ignoré */ }
      }
      if(!ajouts.length){ toast("Aucune vidéo lisible."); return; }
      agir("Import de vidéo",()=>{
        P.clips.push(...ajouts);
        E.toastEnAttente = ajouts.length+" vidéo"+(ajouts.length>1?"s importées":" importée")+".";
      });
    });
    return;
  }

  if(nom==="supprimerClip") return agir("Suppression du clip",()=>{
    P.clips=P.clips.filter(c=>c.id!==E.ctx.clipId); E.pile.pop();
  });

  if(nom==="couperIci"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId), i=P.clips.indexOf(c);
    const t=E.ctx.coupe ?? (c.fin-c.debut)/2;
    return agir("Coupe",()=>{
      const b={...c,id:"c"+Date.now(),debut:c.debut+t};
      c.fin=c.debut+t; P.clips.splice(i+1,0,b); E.ctx.coupe=undefined; E.pile=["montage"];
    });
  }
  if(nom==="raccourcirOK"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId), d0=c.debut;
    const a2=E.ctx.rA??0, b2=E.ctx.rB??(c.fin-c.debut);
    return agir("Raccourci",()=>{ c.fin=d0+b2; c.debut=d0+a2; E.ctx.rA=E.ctx.rB=undefined; E.pile.pop(); });
  }
  if(nom==="zoomOK"){
    const c=P.clips.find(x=>x.id===E.ctx.clipId);
    return agir("Zoom",()=>{ c.zoomAmplitude=E.ctx.zA??c.zoomAmplitude; c.zoomSens=E.ctx.zS??c.zoomSens;
      E.ctx.zA=E.ctx.zS=undefined; E.pile.pop(); });
  }

  if(nom==="ajouterSon"){
    choisirFichier("audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.mp4,.mov", false, async file=>{
      toast("Analyse de « "+file.name+" »…");
      try{
        const {env,duree} = await analyserAudio(file, e=>toast(e+"…"));
        const id="a"+Date.now();
        MEDIA.sons[id] = Object.assign(new Audio(URL.createObjectURL(file)),{preload:"auto"});
        agir("Ajout d'une bande son",()=>{
          P.audios.push({id,nom:file.name,duree,dureeSource:duree,debut:0,decalage:0,env,url:true});
          E.toastEnAttente = file.name+" ajouté, "+tpsD(duree)+".";
        });
      }catch(e){ toast("Fichier illisible : "+(e && e.message ? e.message : "format non reconnu")+"."); }
    });
    return;
  }
  if(nom==="retirerSon") return agir("Retrait de la bande son",()=>{
    P.audios=P.audios.filter(x=>x.id!==arg); if(P.voixOffId===arg) P.voixOffId=null;
  });

  if(nom==="calerTexte"){
    const txt = E.ctx.texte ?? (P.texteSource || TEXTE_DEMO);
    if(!txt.trim()){ toast("Collez d'abord votre texte."); return rendre(); }
    const voix = E.ctx.voix ?? (P.audios[0]&&P.audios[0].id);
    E.pile.push("encours"); rendre();
    let pct=0;
    const etapes=["Analyse des respirations","Répartition du texte","Découpage des lignes"];
    const it=setInterval(()=>{
      if(E.calageT!==it) return; // calage abandonné
      pct+=7+Math.random()*9;
      const j=document.getElementById("jauge"), jt=document.getElementById("jaugeTxt");
      if(j) j.style.width=Math.min(100,pct)+"%";
      if(jt) jt.textContent=etapes[Math.min(2,Math.floor(pct/34))];
      if(pct>=100){
        clearInterval(it); E.calageT=null;
        agir("Calage",()=>{
          const bande = P.audios.find(a=>a.id===voix) || P.audios[0];
          const r=caler(txt, bande && bande.env);
          if(!r){ E.pile=["montage","soustitres"]; E.toastEnAttente="Calage impossible : texte ou bande son manquants."; return; }
          const dec = bande ? (bande.decalage - (bande.debut||0)) : 0; // source -> montage
          r.paragraphes.forEach(p=>{ p.debut+=dec; p.fin+=dec; });
          P.texteSource=txt; P.voixOffId=voix;
          P.paragraphes=r.paragraphes; E.pauses=r.pauses; E.compteRendu=r.compteRendu;
          P.sousTitres=P.sousTitres.filter(s=>!s.paragrapheId);
          regenerer();
          E.ctx.texte=undefined; E.ctx.paraActif=null;
          E.pile=["montage","soustitres","verif"];
        });
      }
    },140);
    E.calageT=it;
    return;
  }

  if(nom==="commenceIci"){
    const p=P.paragraphes.find(x=>x.id===E.ctx.paraActif); if(!p) return;
    const t=E.lecture?E.lecture.t:p.debut;
    return agir("Recalage",()=>{
      const ecart=t-p.debut, i=P.paragraphes.indexOf(p);
      P.paragraphes.forEach((q,k)=>{ if(k>=i){ q.debut+=ecart; q.fin+=ecart; } });
      p.cale=true; regenerer();
      E.toastEnAttente="Passage recalé, la suite a suivi.";
    });
  }

  if(nom==="pleinEcran"){
    E.pleinEcran=!E.pleinEcran; E.zoomAp={scale:1}; // le pincement ne survit pas à l'entrée/sortie
    return rendre();
  }
  if(nom==="quitterAuto"){ E.auto=null; E.pile=["montage"]; return rendre(true); }
  if(nom==="stopAuto"){
    E.autoAbandonne=true; // l'analyse en cours ne doit plus rien afficher
    E.pile = (E.auto && E.auto.sequences) ? ["montage","autoMedias"] : ["montage","autoTexte"];
    return rendre();
  }

  if(nom==="autoChoisirSon"){
    const txt = (E.auto && E.auto.texte) || "";
    if(!txt.trim()){ toast("Collez d'abord votre texte."); return; }
    // Une vidéo est acceptée : seule sa piste audio est analysée.
    choisirFichier("audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.mp4,.mov", false, async file=>{
      E.autoAbandonne=false;
      E.pile.push("autoEnCours"); rendre();
      let pct=15;
      const etape = libelle=>{
        if(E.autoAbandonne) return;
        pct=Math.min(85,pct+25);
        const j=document.getElementById("jaugeAuto"); if(j) j.style.width=pct+"%";
        const t=document.getElementById("jaugeAutoTxt"); if(t) t.textContent=libelle;
      };
      try{
        const {env,duree} = await analyserAudio(file, etape);
        if(E.autoAbandonne) return; // l'utilisateur est parti : ne rien imposer
        const sq = sequencerAudio(env);
        const id="a"+Date.now();
        MEDIA.sons[id]=Object.assign(new Audio(URL.createObjectURL(file)),{preload:"auto"});
        E.auto = Object.assign(E.auto||{}, {
          texte:txt, audio:{id,nom:file.name,duree,env}, ...sq,
          medias:new Array(sq.sequences.length).fill(null),
        });
        E.pile=["montage","autoMedias"]; rendre();
      }catch(e){
        if(E.autoAbandonne) return;
        E.pile=["montage","autoTexte"]; rendre();
        toast("Fichier illisible : "+(e && e.message ? e.message : "format non reconnu")+".");
      }
    });
    return;
  }

  if(nom==="autoMedia"){
    const i=parseInt(arg,10);
    choisirFichier("video/*,image/*", false, async file=>{
      const estImage = /^image\//.test(file.type);
      const url=URL.createObjectURL(file);
      try{
        if(estImage){
          const im=document.createElement("img");
          im.src=url; im.alt="";
          await new Promise((res,rej)=>{
            im.addEventListener("load",res,{once:true});
            im.addEventListener("error",rej,{once:true});
            setTimeout(rej,12000);
          });
          E.auto.medias[i]={kind:"image", nom:file.name, el:im, duree:Infinity};
        } else {
          const v=document.createElement("video");
          v.src=url; v.preload="auto"; v.playsInline=true;
          const duree=await new Promise((res,rej)=>{
            v.addEventListener("loadedmetadata",()=>res(v.duration),{once:true});
            v.addEventListener("error",rej,{once:true});
            setTimeout(rej,12000);
          });
          E.auto.medias[i]={kind:"video", nom:file.name, el:v, duree};
        }
        rendre();
      }catch(e){ toast("Ce fichier n'a pas pu être lu."); }
    });
    return;
  }

  if(nom==="autoMonter"){
    const A=E.auto;
    if(!A || A.medias.some(m=>!m)) return;
    E.pile.push("autoEnCours"); rendre();
    const jt=document.getElementById("jaugeAutoTxt");
    if(jt) jt.textContent="Calage des sous-titres";
    const j=document.getElementById("jaugeAuto"); if(j) j.style.width="60%";

    setTimeout(()=>{
      agir("Montage automatique", ()=>{
        const env=A.audio.env;

        /* Les clips sont lus bout à bout : pour que l'image reste synchrone
           avec la voix, ils doivent couvrir TOUTE la durée, silences compris.
           On coupe donc au milieu de chaque silence — le silence est bien la
           transition, et chaque plan en porte la moitié. */
        const coupes=[0];
        for(const sil of A.silences) coupes.push((sil.debut+sil.fin)/2);
        coupes.push(env.duree);

        const clips=[]; const avertissements=[];
        A.sequences.forEach((sq,i)=>{
          const m=A.medias[i];
          const besoin=coupes[i+1]-coupes[i];
          const id="c"+Date.now()+"_"+i;
          if(m.kind==="image"){
            MEDIA.images[id]=m.el;
            // Zoom lent systématique : une image figée décroche l'attention.
            clips.push({id,nom:m.nom,debut:0,fin:besoin,finMax:besoin,
              zoomAmplitude:10,zoomSens: i%2 ? "arriere":"avant"});
          } else {
            MEDIA.videos[id]=m.el;
            const garde=Math.min(m.duree,besoin);
            if(m.duree<besoin-0.05)
              avertissements.push(`la séquence ${i+1} dure ${besoin.toFixed(1)} s mais son média n'en fait que ${m.duree.toFixed(1)}`);
            clips.push({id,nom:m.nom,debut:0,fin:garde,finMax:m.duree,
              zoomAmplitude:0,zoomSens:"avant"});
          }
        });

        const P=E.projet;
        P.clips=clips;
        P.audios=[{id:A.audio.id,nom:A.audio.nom,duree:A.audio.duree,
          dureeSource:A.audio.duree,debut:0,decalage:0,env,url:true}];
        P.voixOffId=A.audio.id;
        P.texteSource=A.texte;
        P.paragraphes=[];
        P.style.x=50; P.style.y=88; // sous-titres toujours en bas, au centre

        const textes=sousTitresDuTexte(A.texte,P.style.taillePct,1080);
        const cales=calerSousTitresAuto(textes,A.pauses,env.duree,0);
        P.sousTitres=cales.map(c=>({id:"s"+Math.random().toString(36).slice(2),
          debut:c.debut,fin:c.fin,texte:c.texte,paragrapheId:null}));
        E.pauses=A.pauses;

        const nSeq=A.sequences.length;
        let phrase=`${nSeq} séquence${nSeq>1?"s":""} montée${nSeq>1?"s":""} sur `+
          `${A.silences.length} silence${A.silences.length>1?"s":""}, `+
          `${P.sousTitres.length} sous-titres de 7 mots au plus.`;
        if(avertissements.length) phrase+=" À vérifier : "+avertissements.join(" ; ")+".";
        E.compteRendu={total:0,surPause:0,estimees:0,ecart:0,phrase};
        E.toastEnAttente=phrase;
        E.auto=null; E.pile=["montage"]; E.lecture={t:0};
      });
    },220);
    return;
  }

  if(nom==="debut"){ arreterLecture(); E.lecture={t:0}; rendre(); assurerVisible("debut"); return; }
  if(nom==="fin"){ arreterLecture(); E.lecture={t:Math.max(0,dureeTotale()-0.05)}; rendre(); assurerVisible("fin"); return; }
  if(nom==="lire"||nom==="lecture"){
    if(enLecture()) arreterLecture();
    else { if(!E.lecture||E.lecture.t>=dureeTotale()-0.05) E.lecture={t:0}; lancerLecture(); }
    return rendre();
  }

  if(nom==="redecouper"){
    const np=P.paragraphes.length, nc=P.clips.length;
    const msg = np===nc ? np+" paragraphes pour "+nc+" clips — chaque clip couvrira son paragraphe."
      : np>nc ? np+" paragraphes pour "+nc+" clips — les clips seront réutilisés en boucle."
      : np+" paragraphes pour "+nc+" clips — les clips en trop sont conservés à la fin.";
    if(!confirm(msg+"\n\nValider ?")) return;
    return agir("Découpage des plans",()=>{
      const neufs=[];
      P.paragraphes.forEach((p,i)=>{
        const src=P.clips[i%P.clips.length];
        neufs.push({...src,id:"c"+i+"_"+Date.now(),debut:0,fin:Math.max(.3,p.fin-p.debut)});
      });
      if(P.clips.length>P.paragraphes.length) neufs.push(...P.clips.slice(P.paragraphes.length));
      P.clips=neufs; E.pile=["montage"];
    });
  }

  if(nom==="srt"){
    if(arg==="parcourir") return toast("Sélecteur de fichiers de l'appareil.");
    const n = arg==="recitation-v3.srt" ? 47 : 12;
    if(!confirm("Remplacer les sous-titres existants ?")) return;
    return agir("Import .srt",()=>{
      P.sousTitres=[]; P.paragraphes=[]; E.compteRendu=null;
      let t=1.2;
      for(let i=0;i<n;i++){ const d=1.1+Math.random()*1.4;
        P.sousTitres.push({id:"i"+i,debut:t,fin:t+d,texte:"Entrée "+(i+1)+" du fichier",paragrapheId:null}); t+=d+.25; }
      E.pile=["montage"];
      E.toastEnAttente=n+" sous-titres importés depuis "+arg;
    });
  }

  if(nom==="ajouterST") return agir("Ajout d'un sous-titre",()=>{
    const s={id:"m"+Date.now(),debut:0,fin:2,texte:"Nouveau sous-titre",paragrapheId:null};
    P.sousTitres.push(s); P.sousTitres.sort((a,b)=>a.debut-b.debut);
    E.pile.push("editST"); E.ctx.stId=s.id;
  });
  if(nom==="dec"){
    const s=P.sousTitres.find(x=>x.id===arg); if(!s) return;
    return agir("Minutage",()=>{
      const d=parseInt(arg3,10)*0.2;
      if(arg2==="debut") s.debut=Math.max(0,Math.min(s.debut+d,s.fin-0.2));
      else s.fin=Math.max(s.debut+0.2,s.fin+d);
      P.sousTitres.sort((a,b)=>a.debut-b.debut);
    });
  }
  if(nom==="supprimerST") return agir("Suppression",()=>{
    P.sousTitres=P.sousTitres.filter(x=>x.id!==arg); E.pile.pop();
  });

  if(nom==="replacer") return agir("Replacement",()=>{
    P.style.x=50; P.style.y=88; P.style.taillePct=5; regenerer();
  });

  if(nom==="lancerExport"){
    E.ctx.exportPct=0; rendre();
    const it=setInterval(()=>{
      E.ctx.exportPct=Math.min(100,E.ctx.exportPct+4+Math.random()*6);
      if(E.ctx.exportPct>=100){ clearInterval(it); E.ctx.exportPct=undefined; E.ctx.exportFini=true; }
      rendre();
    },130);
    return;
  }
  if(nom==="finExport"){ E.ctx.exportFini=false; E.pile=["montage"]; return rendre(true); }
}

/* ---------- 9. Lecture pour la vérification ------------------------------ */

function medias(){
  const out=[];
  for(const a of E.projet.audios){
    const el=MEDIA.sons[a.id];
    if(el) out.push({el, debut:a.decalage, fin:a.decalage+a.duree, entree:a.debut||0});
  }
  return out;
}
function synchroniserMedias(t, force){
  for(const m of medias()){
    const dedans = t>=m.debut && t<m.fin;
    if(dedans){
      const local = t-m.debut+m.entree; // le point d'entrée décale la lecture dans le fichier
      if(force || Math.abs(m.el.currentTime-local)>0.25){ try{ m.el.currentTime=local; }catch(e){} }
      if(enLecture() && m.el.paused) m.el.play().catch(()=>{});
      if(!enLecture() && !m.el.paused) m.el.pause();
    } else if(!m.el.paused) m.el.pause();
  }
}
function arreterMedias(){
  for(const m of medias()) if(!m.el.paused) m.el.pause();
  for(const id in MEDIA.videos){ const v=MEDIA.videos[id]; if(!v.paused) v.pause(); }
}

/* La bande doit suivre les trois commandes de lecture, pas juste la tête qui
   avance dans le vide : un rendu complet recrée #defil à scrollLeft=0, donc
   sans ceci « Aller à la fin » laisse le début affiché pendant que la tête
   de lecture est hors champ, loin à droite. */
function assurerVisible(cible){
  const defil=document.getElementById("defil"), piste=document.getElementById("piste");
  if(!defil||!piste) return;
  if(cible==="debut"){ defil.scrollLeft=0; return; }
  if(cible==="fin"){ defil.scrollLeft=Math.max(0, piste.scrollWidth-defil.clientWidth); return; }
  const x=cible*echelle(), marge=40;
  if(x < defil.scrollLeft+marge) defil.scrollLeft=Math.max(0,x-marge);
  else if(x > defil.scrollLeft+defil.clientWidth-marge) defil.scrollLeft=x-defil.clientWidth+marge;
}

function lancerLecture(){
  arreterLecture();
  if(!E.lecture) E.lecture={t:0};
  const fin = dureeTotale();
  E.lecture.actif = true;
  E.lecture.horloge = (typeof performance!=="undefined"?performance.now():Date.now()) - E.lecture.t*1000;
  synchroniserMedias(E.lecture.t, true);
  const maintenant = ()=> (typeof performance!=="undefined"?performance.now():Date.now());
  const boucle = ()=>{
    if(!E.lecture || !E.lecture.actif) return;
    E.lecture.t = (maintenant()-E.lecture.horloge)/1000;
    if(E.lecture.t>=fin){ E.lecture.t=fin; arreterLecture(); rendre(); return; }
    synchroniserMedias(E.lecture.t);
    peindreApercu(E.lecture.t);
    majTete(E.lecture.t);
    assurerVisible(E.lecture.t);
    const l=document.getElementById("tLect");
    if(l) l.textContent = tpsD(E.lecture.t)+" / "+tpsD(fin);
    const l2=document.getElementById("tLectPlein");
    if(l2) l2.textContent = tpsD(E.lecture.t)+" / "+tpsD(fin);
    E.lecture.raf = requestAnimationFrame(boucle);
  };
  E.lecture.raf = requestAnimationFrame(boucle);
}
function arreterLecture(){
  if(E.lecture){
    E.lecture.actif=false;
    if(E.lecture.raf){ cancelAnimationFrame(E.lecture.raf); E.lecture.raf=null; }
  }
  arreterMedias();
}

/* ---------- 10. Placement au doigt (4.7) --------------------------------- */

function brancherPlacement(){
  const zone=document.getElementById("zoneAppar"); if(!zone) return;
  const cadre=zone.querySelector(".neuf16"); const t=zone.querySelector(".st"); if(!cadre||!t) return;
  t.style.pointerEvents="auto"; t.style.cursor="grab";
  t.addEventListener("pointerdown",ev=>{
    ev.preventDefault(); t.setPointerCapture(ev.pointerId);
    const bouger=e2=>{
      const r=cadre.getBoundingClientRect();
      const x=Math.max(8,Math.min(92,(e2.clientX-r.left)/r.width*100));
      const y=Math.max(22,Math.min(98,(e2.clientY-r.top)/r.height*100));
      E.projet.style.x=x; E.projet.style.y=y;
      t.style.left=x+"%"; t.style.top=y+"%";
    };
    const finir=()=>{ t.removeEventListener("pointermove",bouger); t.removeEventListener("pointerup",finir); };
    t.addEventListener("pointermove",bouger); t.addEventListener("pointerup",finir);
  });
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && E.pleinEcran){ E.pleinEcran=false; E.zoomAp={scale:1}; rendre(); }
});

/* ---------- Pincement du montage lui-même : uniquement en plein écran ---- */
const GesteAp = { actifs:new Map(), dist0:0 };

function brancherPinceApercu(){
  const cadre=document.getElementById("apCadre"); if(!cadre) return;
  GesteAp.actifs.clear();
  const distance=()=>{
    const pts=[...GesteAp.actifs.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  };
  cadre.addEventListener("pointerdown",e=>{
    GesteAp.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(GesteAp.actifs.size===2) GesteAp.dist0=distance();
  });
  cadre.addEventListener("pointermove",e=>{
    if(!GesteAp.actifs.has(e.pointerId)) return;
    GesteAp.actifs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(GesteAp.actifs.size===2 && GesteAp.dist0>0){
      const d=distance();
      const echelleNouvelle = Math.max(1, Math.min(3, (E.zoomAp.scale||1) * (d/GesteAp.dist0)));
      GesteAp.dist0=d;
      E.zoomAp.scale=echelleNouvelle;
      const z=document.getElementById("apZoom");
      if(z) z.style.transform="scale("+echelleNouvelle.toFixed(3)+")";
    }
  });
  const relacher=e=>{
    GesteAp.actifs.delete(e.pointerId);
    if(GesteAp.actifs.size<2) GesteAp.dist0=0;
  };
  cadre.addEventListener("pointerup",relacher);
  cadre.addEventListener("pointercancel",relacher);
}

/* ---------- démarrage ---------------------------------------------------- */
rendre();
